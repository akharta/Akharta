/* ═══ Vista de páginas A5 (148×210 mm, márgenes 2 / 2,5 / 2,2 / 1,6 cm) ═══ */
function openPages(){
  const ch=chNow();if(!ch)return;
  const ov=document.createElement('div');ov.className='pgv'+(ch.indent?' ind':'');
  const wrap=document.createElement('div');wrap.className='pg-wrap';ov.appendChild(wrap);
  const bar=document.createElement('div');bar.className='bk-bar';
  bar.innerHTML=`<button class="btn" id="pgClose">✕ Cerrar</button>`;
  document.body.append(ov,bar);
  const z=Math.min(1,(innerWidth-16)/559);
  if(z<1)wrap.style.zoom=z;
  const src=document.createElement('div');src.innerHTML=ch.body||'<p><br></p>';
  let blocks=[...src.children];
  if(!blocks.length){const p=document.createElement('p');p.innerHTML=src.innerHTML||'<br>';blocks=[p]}
  let cur=null;
  const newPage=()=>{
    const pg=document.createElement('div');pg.className='pg';
    const body=document.createElement('div');body.className='pg-body';
    const num=document.createElement('div');num.className='pg-num';
    pg.append(body,num);wrap.appendChild(pg);
    cur=body;
  };
  const over=()=>cur.scrollHeight>cur.clientHeight+1;
  const splitTail=bl=>{ /* retira nodos (o palabras del último texto) hasta que quepa */
    const carry=[];let guard=0;
    while(over()&&guard++<500){
      const last=bl.lastChild;
      if(!last)break;
      if(last.nodeType===3&&bl.childNodes.length===1){
        const words=last.nodeValue.split(/(?<=\s)/);
        let lo=0,hi=words.length;
        while(lo<hi){
          const mid=(lo+hi)>>1;
          last.nodeValue=words.slice(0,mid).join('');
          if(over())hi=mid;else lo=mid+1;
        }
        const keep=Math.max(0,lo-1);
        last.nodeValue=words.slice(0,keep).join('');
        const rest=words.slice(keep).join('');
        if(rest)carry.unshift(document.createTextNode(rest));
        break;
      }
      carry.unshift(last);bl.removeChild(last);
    }
    return carry.length?carry:null;
  };
  newPage();
  for(const bl0 of blocks){
    let bl=bl0;
    cur.appendChild(bl);
    if(!over())continue;
    if(cur.children.length>1){newPage();cur.appendChild(bl)}
    let guard=0;
    while(over()&&guard++<200){
      const carry=splitTail(bl);
      if(!carry)break; /* indivisible: se queda recortado en su página */
      newPage();
      const cont=bl.cloneNode(false);
      for(const n of carry)cont.appendChild(n);
      cur.appendChild(cont);
      bl=cont;
    }
  }
  const pages=wrap.querySelectorAll('.pg');
  pages.forEach((pg,i)=>pg.querySelector('.pg-num').textContent=`pág. ${i+1} de ${pages.length}`);
  const close=()=>{ov.remove();bar.remove()};
  openOverlay(close);
  bar.querySelector('#pgClose').onclick=()=>closeOverlayUI(close);
}

/* ═══ Revisión de escritura (offline: puntuación, espacios, repeticiones, frases largas) ═══ */
let revList=[],revOn=false;
function revClear(){
  const ed=$('#ed');
  if(ed)for(const mk of ed.querySelectorAll('mark.rvk')){
    const p=mk.parentNode;p.replaceChild(document.createTextNode(mk.textContent),mk);p.normalize();
  }
  revList=[];revOn=false;
  const x=document.getElementById('revExit');if(x)x.remove();
}
const REV_RULES=[
  [/\b(\p{L}{2,})\s+\1\b/giu,'Palabra repetida'],
  [/ {2,}/g,'Espacios dobles'],
  [/\s+[,.;:!?]/g,'Espacio antes del signo de puntuación'],
  [/[,;:](?=\p{L})/gu,'Falta un espacio tras el signo'],
  [/\.(?=\p{Lu})/gu,'Falta un espacio tras el punto'],
  [/[!?]{2,}|,{2,}|;{2,}|\.{4,}/g,'Signos de puntuación repetidos'],
  [/--+/g,'Guiones dobles (¿querías una raya —?)']
];
function runReview(){
  revClear();
  const ed=$('#ed');if(!ed)return;
  const items=[];
  for(const t of textNodes(ed)){
    const str=t.nodeValue;
    const parts=[];
    for(const[re,msg]of REV_RULES){
      re.lastIndex=0;let m;
      while((m=re.exec(str))){
        if(!m[0]){re.lastIndex++;continue}
        parts.push([m.index,Math.max(1,m[0].length),msg]);
      }
    }
    if(!parts.length)continue;
    parts.sort((a,b)=>a[0]-b[0]);
    const sel=[];let end=-1;
    for(const p of parts){if(p[0]>=end){sel.push(p);end=p[0]+p[1]}}
    const frag=document.createDocumentFragment();let pos=0;
    for(const[i,len,msg]of sel){
      if(i>pos)frag.appendChild(document.createTextNode(str.slice(pos,i)));
      const mk=document.createElement('mark');mk.className='rvk';mk.textContent=str.slice(i,i+len);
      frag.appendChild(mk);
      items.push({msg,ctx:str.slice(Math.max(0,i-26),Math.min(str.length,i+len+26)).trim(),anchor:mk});
      pos=i+len;
    }
    if(pos<str.length)frag.appendChild(document.createTextNode(str.slice(pos)));
    t.parentNode.replaceChild(frag,t);
  }
  for(const bl of edBlocks()){
    const txt=bl.textContent;
    for(const[a,b2,msg]of[['¿','?','Se abre ¿ pero falta el ?'],['¡','!','Se abre ¡ pero falta el !'],['(',')','Paréntesis sin cerrar'],['«','»','Comillas « sin cerrar »']]){
      const na=txt.split(a).length-1,nb=txt.split(b2).length-1;
      if(na>nb||(na>0&&txt.lastIndexOf(a)>txt.lastIndexOf(b2)))items.push({msg,ctx:txt.trim().slice(0,52),anchor:bl});
    }
    for(const fr of txt.split(/[.!?]+/)){
      const nw=fr.trim().split(/\s+/).filter(Boolean).length;
      if(nw>55){items.push({msg:`Frase muy larga (${nw} palabras)`,ctx:fr.trim().slice(0,52),anchor:bl});break}
    }
  }
  revList=items;revOn=true;
  const ch=chNow();if(ch)ch.body=cleanBody(ed);
  renderDrawer();
}
function revGo(i){
  const it=revList[i];
  if(!it||!it.anchor||!it.anchor.isConnected){toast('El texto cambió: vuelve a analizar');return}
  if(window._drawerClose)closeOverlayUI(window._drawerClose);
  for(const m of document.querySelectorAll('mark.rvk.cur'))m.classList.remove('cur');
  if(it.anchor.tagName==='MARK')it.anchor.classList.add('cur');
  it.anchor.scrollIntoView({block:'center'});
  let x=document.getElementById('revExit');
  if(!x){
    x=document.createElement('button');x.id='revExit';x.className='btn btn-p';
    x.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));z-index:50';
    document.body.appendChild(x);
  }
  x.textContent='✕ Terminar revisión';
  x.onclick=revClear;
}
function drawRev(ch){
  return `<p class="muted small" style="margin-bottom:10px">Revisión sin conexión: puntuación, espacios, repeticiones, signos sin cerrar y frases largas. La ortografía la subraya tu teclado o navegador directamente mientras escribes.</p>
  <button class="btn btn-p" onclick="runReview()">Analizar el capítulo</button>
  <div style="margin-top:14px">${
    revOn?(revList.length
      ?`<p class="small muted" style="margin-bottom:8px">${revList.length} ${revList.length===1?'aviso':'avisos'} — toca uno para ir a esa parte del texto.</p>`
        +revList.map((it,i)=>`<button class="rv-item" onclick="revGo(${i})"><div class="rv-msg">${esc(it.msg)}</div><div class="rv-ctx">…${esc(it.ctx)}…</div></button>`).join('')
      :'<p class="small" style="color:var(--ok)">Sin avisos: el texto está limpio según estas reglas. ✦</p>')
    :''
  }</div>`;
}

function updScene(id,k,v){const sc=chNow().scenes.find(s=>s.id===id);if(sc){sc[k]=v;scheduleSave()}}
function mvScene(i,d){const a=chNow().scenes,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];scheduleSave();renderDrawer()}

/* Tramos de escena dentro del capítulo */
function edBlocks(){const ed=$('#ed');return ed?[...ed.children]:[]}
function selBlockRange(){
  const ed=$('#ed'),sel=getSelection();
  if(!ed||!sel||!sel.rangeCount)return null;
  const blocks=edBlocks();
  const find=n=>{while(n&&n.parentNode!==ed)n=n.parentNode;return blocks.indexOf(n)};
  const a=find(sel.anchorNode),b=find(sel.focusNode);
  if(a<0||b<0)return null;
  return[Math.min(a,b),Math.max(a,b)];
}
function assignSceneSel(id){
  const ch=chNow(),sc=ch&&ch.scenes.find(s=>s.id===id);if(!sc)return;
  const r=selBlockRange();
  if(!r){toast('Selecciona primero en el capítulo el texto de la escena');return}
  sc.from=r[0];sc.to=r[1];scheduleSave();renderDrawer();
  toast(`Escena asignada a los párrafos ${r[0]+1}–${r[1]+1}`);
}
function clearSceneRange(id){
  const ch=chNow(),sc=ch&&ch.scenes.find(s=>s.id===id);if(!sc)return;
  sc.from=null;sc.to=null;scheduleSave();renderDrawer();
}
function sceneFocus(id){
  const ch=chNow(),sc=ch&&ch.scenes.find(s=>s.id===id);if(!sc)return;
  if(sc.from==null){toast('Esta escena aún no tiene texto asignado');return}
  if(window._drawerClose)closeOverlayUI(window._drawerClose);
  const blocks=edBlocks();
  blocks.forEach((b,i)=>b.classList.toggle('sc-dim',i<sc.from||i>sc.to));
  let x=document.getElementById('scExit');
  if(!x){x=document.createElement('button');x.id='scExit';x.className='btn btn-p';document.body.appendChild(x)}
  x.textContent=`✕ Ver todo el capítulo`;
  x.onclick=sceneExit;
  const first=blocks[Math.min(sc.from,blocks.length-1)];
  if(first)first.scrollIntoView({block:'center'});
}
function sceneExit(){
  for(const b of edBlocks())b.classList.remove('sc-dim');
  const x=document.getElementById('scExit');if(x)x.remove();
}

function toggleChapLink(chId,type,entId,on){

  const L=f.ch.links;
  if(on){if(!L.some(l=>l.type===type&&l.id===entId))L.push({type,id:entId})}

function bookChecklist(type,entId){
  const b=curBook();

  return `<div class="check-list">${b.chapters.map(c=>`<label>
    <input type="checkbox" ${c.links.some(l=>l.type===type&&l.id===entId)?'checked':''} onchange="toggleChapLink('${c.id}','${type}','${entId}',this.checked)"><span>${esc(c.title)}</span></label>`).join('')}</div>`;

function entOfKind(kind,id,ctx){

  if(kind==='egg')return s.easterEggs.find(e=>e.id===id);
  if(kind==='hito'){const tl=s.timelines.find(t=>t.id===ctx);return tl&&tl.hitos.find(h=>h.id===id)}

    <div class="field"><span class="lbl">Descripción</span><textarea oninput="updGroup('${g.id}','body',this.value)">${esc(g.body)}</textarea></div>
    <div class="field"><span class="lbl">Miembros</span>
      <div class="chips" style="margin-bottom:8px">${g.members.map(id=>{const c=charById(s,id);return c?`<span class="chip click" onclick="openEnt('character','${c.id}')">${esc(c.name)}<span class="x" onclick="event.stopPropagation();rmMember('${g.id}','${c.id}')">✕</span></span>`:''}).join('')||'<span class="muted small">Sin miembros.</span>'}</div>
      ${free.length?`<select onchange="addMember('${g.id}',this.value);this.value=''"><option value="">＋ Añadir miembro…</option>${free.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:''}</div>
    <div class="field"><span class="lbl">Easter eggs vinculados</span>
      <div class="chips">${s.easterEggs.filter(e=>(e.links||[]).some(l=>l.type==='groups'&&l.id===g.id)).map(e=>`<span class="chip click" onclick="openEnt('egg','${e.id}')">${esc(e.title)}</span>`).join('')||'<span class="muted small">Ninguno.</span>'}</div></div>
    <div class="field"><span class="lbl">Aparece en los capítulos (toda la saga)</span>${sagaChecklist('group',g.id)}</div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delGroup('${g.id}')">Eliminar</button>`;
}
function updGroup(id,k,v){const g=curSaga().groups.find(x=>x.id===id);if(g){g[k]=v;g.updated=Date.now();scheduleSave();if(k==='status')render()}}
function addMember(gid,cid){if(!cid)return;const g=curSaga().groups.find(x=>x.id===gid);if(!g.members.includes(cid))g.members.push(cid);scheduleSave();render()}
function rmMember(gid,cid){const g=curSaga().groups.find(x=>x.id===gid);g.members=g.members.filter(x=>x!==cid);scheduleSave();render()}
async function delGroup(id){
  const s=curSaga(),g=s.groups.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el grupo «${g.name}».`))return;
  toTrash('group',g.name,{sagaId:s.id},g);
  s.groups=s.groups.filter(x=>x.id!==id);
  scheduleSave();toast('Grupo eliminado (papelera)');goBack();
}
/* — Hito — */
function entHito(s,r){
  const h=entOfKind('hito',r.id,r.ctx);if(!h)return null;
  return `
    <div class="field"><span class="lbl">Título</span><input value="${esc(h.title)}" oninput="updHito('${r.ctx}','${h.id}','title',this.value)"></div>
    <div class="row">
      <div class="field" style="flex:1"><span class="lbl">Tipo de marcador</span>
        <select onchange="updHito('${r.ctx}','${h.id}','kind',this.value)">
          ${Object.entries(HKINDS).map(([k,[l]])=>`<option value="${k}" ${h.kind===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field" style="width:110px"><span class="lbl">Orden</span>
        <input type="number" value="${h.order}" onchange="updHitoOrder('${r.ctx}','${h.id}',this.value)"></div></div>
    <div class="field"><span class="lbl">Ancla temporal</span>
      <input value="${esc(h.anchor)}" placeholder="Mes y año, aunque sean ficticios…" oninput="updHito('${r.ctx}','${h.id}','anchor',this.value)"></div>
    <div class="field"><span class="lbl">Descripción</span><textarea oninput="updHito('${r.ctx}','${h.id}','body',this.value)">${esc(h.body)}</textarea></div>
    <div class="field"><span class="lbl">Capítulos que transcurren en este hito (toda la saga)</span>${sagaChecklist('hito',h.id,r.ctx)}</div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delHito('${r.ctx}','${h.id}')">Eliminar</button>`;
}
function updHito(tlId,id,k,v){const h=entOfKind('hito',id,tlId);if(h){h[k]=v;scheduleSave()}}
function updHitoOrder(tlId,id,v){const n=parseInt(v,10);if(!isNaN(n))updHito(tlId,id,'order',n)}
async function delHito(tlId,id){
  const s=curSaga(),tl=s.timelines.find(t=>t.id===tlId),h=entOfKind('hito',id,tlId);
  if(!await askConfirm(`Eliminar el hito «${h.title}».`))return;
  toTrash('hito',h.title,{sagaId:s.id,tlId},h);
  tl.hitos=tl.hitos.filter(x=>x.id!==id);
  scheduleSave();toast('Hito eliminado (papelera)');goBack();
}
/* — Easter egg — */
function entEgg(s,r){
  const e=s.easterEggs.find(x=>x.id===r.id);if(!e)return null;
  return `
    <div class="field"><span class="lbl">Estado</span><select style="width:auto" onchange="updEgg('${e.id}','status',this.value)">${estadoOpts(e.status)}</select></div>
    <div class="field"><span class="lbl">Título</span><input value="${esc(e.title)}" oninput="updEgg('${e.id}','title',this.value)"></div>
    <div class="field"><span class="lbl">Contenido</span><textarea oninput="updEgg('${e.id}','body',this.value)">${esc(e.body)}</textarea></div>
    <div class="field"><span class="lbl">Vínculos con el mundo</span>
      <div class="chips" style="margin-bottom:8px">${(e.links||[]).map(l=>{
        const cc2=state.meta.catColors;let nm,kind;
        if(l.type==='characters'){const x=charById(s,l.id);nm=x&&x.name;kind='character'}
        else if(l.type==='places'){const x=placeById(s,l.id);nm=x&&x.name;kind='place'}
        else{const x=s.groups.find(g=>g.id===l.id);nm=x&&x.name;kind='group'}
        if(!nm)return'';
        return `<span class="chip click" onclick="openEnt('${kind}','${l.id}')"><span class="cdot" style="background:${cc2[l.type]}"></span>${esc(nm)}<span class="x" onclick="event.stopPropagation();eggRmLink('${e.id}','${l.type}','${l.id}')">✕</span></span>`;
      }).join('')||'<span class="muted small">Sin vínculos con el mundo.</span>'}</div>
      <select onchange="eggAddLink('${e.id}',this.value);this.value=''">
        <option value="">＋ Vincular personaje, lugar o grupo…</option>
        ${[['characters',s.characters,'Personajes'],['places',s.places,'Lugares'],['groups',s.groups,'Grupos']].map(([ty,arr,lb])=>{
          const free=arr.filter(x=>!(e.links||[]).some(l=>l.type===ty&&l.id===x.id));
          return free.length?`<optgroup label="${lb}">${free.map(x=>`<option value="${ty}:${x.id}">${esc(x.name)}</option>`).join('')}</optgroup>`:'';
        }).join('')}
      </select></div>
    <div class="field"><span class="lbl">Vive en los capítulos (toda la saga)</span>${sagaChecklist('egg',e.id)}</div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delEgg('${e.id}')">Eliminar</button>`;
}
function updEgg(id,k,v){const e=curSaga().easterEggs.find(x=>x.id===id);if(e){e[k]=v;e.updated=Date.now();scheduleSave();if(k==='status')render()}}
async function delEgg(id){
  const s=curSaga(),e=s.easterEggs.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el secreto «${e.title}».`))return;
  toTrash('egg',e.title,{sagaId:s.id},e);
  s.easterEggs=s.easterEggs.filter(x=>x.id!==id);
  scheduleSave();toast('Easter egg eliminado (papelera)');goBack();
}
/* — Palabra — */
function entWord(s,r){
  const l=s.languages.find(x=>x.id===r.ctx);if(!l)return null;
  const w=l.words.find(x=>x.id===r.id);if(!w)return null;
  return `
    <div class="field"><span class="lbl">Término (${esc(l.name)})</span><input value="${esc(w.term)}" oninput="updWord('${r.ctx}','${w.id}','term',this.value)"></div>
    <div class="field"><span class="lbl">Tipo gramatical</span><input value="${esc(w.type)}" placeholder="sustantivo, verbo…" oninput="updWord('${r.ctx}','${w.id}','type',this.value)"></div>
    <div class="field"><span class="lbl">Significado</span><input value="${esc(w.meaning)}" oninput="updWord('${r.ctx}','${w.id}','meaning',this.value)"></div>
    <div class="field"><span class="lbl">Notas</span><textarea placeholder="Pronunciación, uso…" oninput="updWord('${r.ctx}','${w.id}','notes',this.value)">${esc(w.notes)}</textarea></div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delWord('${r.ctx}','${w.id}')">Eliminar</button>`;
}
function updWord(langId,id,k,v){const l=curSaga().languages.find(x=>x.id===langId);const w=l&&l.words.find(x=>x.id===id);if(w){w[k]=v;scheduleSave()}}
async function delWord(langId,id){
  const s=curSaga(),l=s.languages.find(x=>x.id===langId),w=l.words.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar la palabra «${w.term||'(sin término)'}».`))return;
  toTrash('word',w.term||'(sin término)',{sagaId:s.id,langId},w);
  l.words=l.words.filter(x=>x.id!==id);
  scheduleSave();toast('Palabra eliminada (papelera)');goBack();
}
/* — Acto — */
function entAct(s,r){
  const b=curBook();if(!b)return null;
  const a=b.acts.find(x=>x.id===r.id);if(!a)return null;
  return `
    <div class="field"><span class="lbl">Estado</span><select style="width:auto" onchange="updAct('${a.id}','estado',this.value)">${estadoOpts(a.estado)}</select></div>
    <div class="field"><span class="lbl">Nombre</span><input value="${esc(a.name)}" oninput="updAct('${a.id}','name',this.value)"></div>
    <div class="field"><span class="lbl">Descripción</span>
      <textarea placeholder="Qué ocurre en este acto…" oninput="updAct('${a.id}','desc',this.value)">${esc(a.desc||'')}</textarea></div>
    <div class="field" style="width:130px"><span class="lbl">Orden</span>
      <input type="number" value="${a.order}" onchange="updActOrder('${a.id}',this.value)"></div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delAct('${a.id}')">Eliminar</button>
    <p class="muted small">Al eliminar un acto, sus capítulos quedan sin asignar.</p>`;
}
function updAct(id,k,v){const a=curBook().acts.find(x=>x.id===id);if(a){a[k]=v;scheduleSave()}}
function updActOrder(id,v){const n=parseInt(v,10);if(!isNaN(n))updAct(id,'order',n)}
async function delAct(id){
  const s=curSaga(),b=curBook(),a=b.acts.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el acto «${a.name}». Sus capítulos quedarán sin asignar.`))return;
  for(const c of b.chapters)if(c.actId===id)c.actId=null;
  toTrash('act',a.name,{sagaId:s.id,bookId:b.id},a);
  b.acts=b.acts.filter(x=>x.id!==id);
  scheduleSave();toast('Acto eliminado (papelera)');goBack();
}

/* ═══════════ Ajustes ═══════════ */
function renderSettings(){
  const m=state.meta;
  const themeCards=Object.entries(THEMES).map(([id,t])=>`
    <button class="themecard ${m.themeId===id?'on':''}" onclick="setTheme('${id}')">
      <div class="sw"><i style="background:${t.v.ink}"></i><i style="background:${t.v.panel}"></i><i style="background:${t.v.lapis}"></i><i style="background:${t.v.text}"></i></div>
      <b>${t.name}</b> <span class="small muted">${t.dark?'oscuro':'claro'}</span></button>`).join('');
  const CATS=[['characters','Personajes'],['places','Ubicaciones'],['groups','Grupos'],['easterEggs','Easter eggs']];
  view().innerHTML=`<div class="wrap-n stack">
    <div><h2>Apariencia</h2>
      <div class="grid" style="margin:10px 0 16px">${themeCards}</div>
      <div class="row" style="margin-bottom:14px">
        <span class="lbl" style="margin:0">Acento</span>
        <input type="color" value="${m.accent||THEMES[m.themeId].v.lapis}" oninput="setAccent(this.value)">
        ${m.accent?'<button class="btn btn-s" onclick="clearAccent()">Quitar acento personalizado</button>':''}
      </div>
      <div class="row" style="margin-bottom:14px">
        <span class="lbl" style="margin:0">Tamaño de letra al escribir</span>
        <div class="seg">${[['s','S'],['m','M'],['l','L']].map(([k,l])=>`<button class="${m.fontScale===k?'on':''}" onclick="setFS('${k}')">${l}</button>`).join('')}</div>
      </div>
      <div class="row">
        <span class="lbl" style="margin:0">Velocidad de lectura (palabras/min)</span>
        <input type="number" min="80" max="600" value="${m.wpm}" style="width:100px" onchange="setWpm(this.value)">
      </div>
    </div>
    <div class="sect"><h2>Imagen de fondo</h2>
      <div class="card stack" style="gap:10px">
        <p class="small muted">Pon una imagen detrás de la app; los colores y paneles seguirán el tema elegido.</p>
        <div class="row">
          <button class="btn ${m.bgImage==='builtin'?'btn-p':''}" onclick="setBg('builtin')">Fondo de Akharta</button>
          <button class="btn" onclick="pickBg()">Elegir imagen…</button>
          ${m.bgImage?'<button class="btn btn-d" onclick="setBg(null)">Quitar fondo</button>':''}
        </div>
        ${m.bgImage?`<div class="row"><span class="lbl" style="margin:0">Velo del tema</span>
          <input type="range" min="70" max="97" value="${Math.round((m.bgVeil??0.9)*100)}" style="width:200px;padding:0;accent-color:var(--lapis)" oninput="setVeil(this.value)">
          <span class="small muted">más bajo = imagen más visible</span></div>`:''}
      </div>
    </div>
    <div class="sect"><h2>Colores por categoría</h2>
      <div class="card">${CATS.map(([k,l])=>`<div class="trow">
        <input type="color" value="${m.catColors[k]}" oninput="setCatColor('${k}',this.value)">
        <div class="tinfo"><b>${l}</b></div></div>`).join('')}</div>
    </div>
    <div class="sect"><h2>Campos de personaje</h2>
      <div class="card">${m.charFields.map(f=>`<div class="trow">
        <div class="tinfo"><b style="cursor:pointer" onclick="renameField('${f.id}')">${esc(f.label)}</b></div>
        <button class="btn btn-s btn-d" onclick="delField('${f.id}')">Eliminar</button></div>`).join('')}
      <div style="padding-top:10px"><button class="btn btn-s" onclick="addField()">＋ Añadir campo</button></div></div>
    </div>
    <div class="sect"><h2>Copias de seguridad</h2>
      <div class="card stack" style="gap:10px">
        <p class="small muted">Última copia: <b>${m.lastBackup?fmtDT(m.lastBackup):'nunca'}</b>. Guarda copias con regularidad: son tu única red de seguridad.</p>
        <div class="row">
          <button class="btn btn-p" onclick="expJson()">Descargar copia .json</button>
          <button class="btn" onclick="expClone()">Descargar clon .html</button>
          <button class="btn" onclick="pickJsonImport()">Importar copia .json</button>
        </div>
        <p class="small muted">El clon .html es esta misma app con tus datos dentro: ábrelo en otro dispositivo y lo restaura todo.</p>
      </div>
    </div>
    <div class="sect"><h2>Papelera <span class="muted small num">${state.trash.length}/25 · 30 días</span></h2>
      <div class="card">${state.trash.map(t=>`<div class="trow">
        <div class="tinfo"><b>${esc(t.label)}</b><span>${TRASH_KINDS[t.kind]||t.kind} · ${fmtDT(t.ts)}</span></div>
        <button class="btn btn-s" onclick="restoreTrash('${t.id}')">Restaurar</button></div>`).join('')||'<p class="muted small">La papelera está vacía.</p>'}
      ${state.trash.length?`<div style="padding-top:10px"><button class="btn btn-s btn-d" onclick="emptyTrash()">Vaciar papelera</button></div>`:''}</div>
    </div>
    <p class="small muted" style="text-align:center;margin-top:10px">Akharta v${APP_VERSION}</p>
  </div>`;
}
function setTheme(id){state.meta.themeId=id;scheduleSave();applyTheme();render()}
function setBg(v){state.meta.bgImage=v;scheduleSave();applyTheme();render()}
function pickBg(){pickImage(u=>{state.meta.bgImage=u;scheduleSave();applyTheme();render()},1400)}
let veilT=null;
function setVeil(v){
  state.meta.bgVeil=Math.min(.97,Math.max(.7,v/100));
  scheduleSave();
  clearTimeout(veilT);veilT=setTimeout(applyTheme,180);
}
function setAccent(v){state.meta.accent=v;scheduleSave();applyTheme()}
function clearAccent(){state.meta.accent=null;scheduleSave();applyTheme();render()}
function setFS(v){state.meta.fontScale=v;scheduleSave();applyTheme();render()}
function setWpm(v){const n=Math.min(600,Math.max(80,parseInt(v,10)||200));state.meta.wpm=n;scheduleSave();render()}
function setCatColor(k,v){state.meta.catColors[k]=v;scheduleSave()}
async function renameField(id){
  const f=state.meta.charFields.find(f=>f.id===id);
  const n=await askText('Renombrar campo',f.label);
  if(n){f.label=n;scheduleSave();render()}
}
async function delField(id){
  const f=state.meta.charFields.find(f=>f.id===id);
  if(!await askConfirm(`Eliminar el campo «${f.label}» de las fichas de personaje.`))return;
  state.meta.charFields=state.meta.charFields.filter(x=>x.id!==id);
  scheduleSave();render();
}
async function addField(){
  const n=await askText('Nuevo campo de personaje');
  if(n){state.meta.charFields.push({id:'f_'+uid(),label:n});scheduleSave();render()}
}
async function emptyTrash(){
  if(!await askConfirm('Vaciar la papelera de forma definitiva.'))return;
  state.trash=[];scheduleSave();render();toast('Papelera vaciada');
}

/* ═══════════ Arranque ═══════════ */
load();
applyTheme();
initDlg();
cropInit();
/* PWA: solo se activa cuando la app se sirve por https (hosting); como archivo local es inerte */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
$('#btnBack').onclick=goBack;
$('#btnGear').onclick=()=>{if(rTop().v!=='settings')go({v:'settings'})};
if(curSaga()&&curBook()){
  ensureSession(curBook());
  route=[{v:'lib'},{v:'book',tab:'resumen'}];
  pushHist();
}
setDot('saved');
render();
</script>
