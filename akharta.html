/* ── Idioma: detalle ── */
function renderLang(r){
  const s=curSaga(),l=s.languages.find(x=>x.id===r.id);
  if(!l){goBack();return}
  const q=(r.q||'').toLowerCase();
  const words=[...l.words].sort((a,b)=>a.term.localeCompare(b.term,'es')).filter(w=>!q||w.term.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q));
  view().innerHTML=`<div class="wrap-n">
    <div class="spread" style="margin-bottom:12px"><h2>${esc(l.name)} <span class="muted small num">${l.words.length} términos</span></h2>
      <div class="row"><button class="btn btn-s" onclick="renameLang('${l.id}')">Renombrar</button>
      <button class="btn btn-s btn-d" onclick="delLang('${l.id}')">Eliminar</button>
      <button class="btn btn-p btn-s" onclick="addWord('${l.id}')">＋ Palabra</button></div></div>
    <div class="searchrow"><input type="search" placeholder="Buscar término…" value="${esc(r.q||'')}" oninput="langSearch(this.value)"></div>
    <div class="card" style="padding:6px 14px">${words.map(w=>`<div class="trow" style="cursor:pointer" onclick="openEnt('word','${w.id}','${l.id}')">
      <div class="tinfo"><b style="font-family:var(--serif);font-style:italic">${esc(w.term)||'—'}</b>
      <span>${esc(w.meaning)}${w.type?` · ${esc(w.type)}`:''}</span></div>
    </div>`).join('')||'<p class="muted small" style="padding:10px 0">Sin términos todavía.</p>'}</div>
  </div>`;
}
async function renameLang(id){const l=curSaga().languages.find(x=>x.id===id);const n=await askText('Renombrar idioma',l.name);if(n){l.name=n;scheduleSave();render()}}
async function delLang(id){
  const s=curSaga(),l=s.languages.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el idioma «${l.name}» con sus ${l.words.length} términos.`))return;
  toTrash('language',l.name,{sagaId:s.id},l);
  s.languages=s.languages.filter(x=>x.id!==id);
  scheduleSave();toast('Idioma eliminado (papelera)');goBack();
}
function addWord(langId){
  const l=curSaga().languages.find(x=>x.id===langId);
  const w={id:uid(),term:'',meaning:'',type:'',notes:''};
  l.words.push(w);scheduleSave();openEnt('word',w.id,langId);
}

/* ── Actos ── */
function renderActos(r,s,b){
  const acts=[...b.acts].sort((x,y)=>x.order-y.order);
  const actSel=(c)=>`<select style="width:auto;font-size:12.5px;padding:5px 7px" onchange="setChapAct('${c.id}',this.value)">
    <option value="">Sin acto</option>
    ${acts.map(a=>`<option value="${a.id}" ${c.actId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`;
  const chapRow=c=>`<div class="trow"><div class="tinfo">
      <b style="cursor:pointer;font-family:var(--serif)" onclick="openChap('${c.id}')">${esc(c.title)}</b>
      <span class="num">${fmtN(chapWords(c))} palabras</span></div>${actSel(c)}</div>`;
  const blocks=acts.map(a=>{
    const chs=b.chapters.filter(c=>c.actId===a.id);
    const w=chs.reduce((n,c)=>n+chapWords(c),0);
    return `<div class="card" style="margin-bottom:14px">
      <div class="spread" style="margin-bottom:6px">
        <h3 style="cursor:pointer" onclick="openEnt('act','${a.id}')">${esc(a.name)}</h3>
        <span class="small muted num">${chs.length} cap. · ${fmtN(w)} palabras</span></div>
      ${chs.map(chapRow).join('')||'<p class="muted small">Sin capítulos en este acto.</p>'}
    </div>`;
  }).join('');
  const libres=b.chapters.filter(c=>!c.actId||!b.acts.some(a=>a.id===c.actId));
  view().innerHTML=`<div class="wrap-n">
    <div class="spread" style="margin-bottom:16px"><h2>Actos</h2>
      <button class="btn btn-p btn-s" onclick="addAct()">＋ Acto</button></div>
    ${blocks}
    <div class="card"><h3 class="muted" style="margin-bottom:6px">Sin asignar</h3>
      ${libres.map(chapRow).join('')||'<p class="muted small">Todos los capítulos están asignados.</p>'}</div>
  </div>`;
}
async function addAct(){
  const b=curBook(),n=await askText('Nuevo acto',`Acto ${['I','II','III','IV','V'][b.acts.length]||b.acts.length+1}`);
  if(!n)return;
  const maxO=b.acts.reduce((m,a)=>Math.max(m,a.order),0);
  b.acts.push({id:uid(),name:n,order:maxO+10});scheduleSave();render();
}
function setChapAct(chId,actId){
  const b=curBook(),c=b.chapters.find(c=>c.id===chId);
  c.actId=actId||null;c.updated=Date.now();scheduleSave();render();
}

/* ── Logros ── */
function renderLogros(r,s,b){
  const w=bookWords(b);
  const hitos=s.timelines.reduce((n,t)=>n+t.hitos.length,0);
  const terms=s.languages.reduce((n,l)=>n+l.words.length,0);
  const badges=[
    ['✒','Primer capítulo','Escribe tu primer capítulo',b.chapters.length>=1],
    ['✦','10.000 palabras','Alcanza las 10.000 palabras',w>=10000],
    ['✧','50.000 palabras','Alcanza las 50.000 palabras',w>=50000],
    ['❖','90.000 palabras','Alcanza las 90.000 palabras',w>=90000],
    ['♟','Elenco','Crea 10 personajes',s.characters.length>=10],
    ['✵','Cartógrafo','Traza 8 ubicaciones',s.places.length>=8],
    ['▦','Estructura','Organiza 3 actos',b.acts.length>=3],
    ['⧖','Cronista','Registra 5 hitos',hitos>=5],
    ['♜','Mundo vivo','Funda 3 grupos',s.groups.length>=3],
    ['✎','Lexicógrafo','Acuña 20 términos',terms>=20]];
  const won=badges.filter(x=>x[3]).length;
  const prog=b.goalWords>0?Math.min(100,Math.round(w/b.goalWords*100)):0;
  view().innerHTML=`<div class="wrap-n">
    <div class="card" style="margin-bottom:14px">
      <div class="spread"><h3>Objetivo del libro</h3>
        <button class="btn btn-s" onclick="setGoal()">${b.goalWords?'Cambiar objetivo':'Fijar objetivo'}</button></div>
      ${b.goalWords?`<div class="spread small num" style="margin:10px 0 8px"><span>${fmtN(w)} / ${fmtN(b.goalWords)} palabras</span><b>${prog}%</b></div>
        <div class="bar"><i style="width:${prog}%"></i></div>`
      :'<p class="muted small" style="margin-top:8px">Sin objetivo de palabras. Fija uno para ver tu progreso.</p>'}
    </div>
    <div class="statgrid" style="margin-bottom:22px">
      <div class="stat"><b class="num">${fmtN(sessDelta(b))}</b><span>Palabras esta sesión</span></div>
      <div class="stat"><b class="num">${fmtN(w)}</b><span>Palabras totales</span></div>
      <div class="stat"><b class="num">${won}/${badges.length}</b><span>Insignias</span></div>
    </div>
    <h2 style="margin-bottom:12px">Insignias</h2>
    <div class="stack" style="gap:8px">${badges.map(([ic,t,d,ok])=>`<div class="badge ${ok?'won':''}">
      <span class="bic">${ic}</span><div><b>${t}</b><span>${d}</span></div></div>`).join('')}</div>
  </div>`;
}
async function setGoal(){
  const b=curBook();
  const n=await askNum('Objetivo de palabras',b.goalWords||90000,'0 = sin objetivo');
  if(n!==null){b.goalWords=Math.max(0,n);scheduleSave();render()}
}
</script>
<script>
'use strict';
/* ═══════════ Editor de capítulo ═══════════ */
const edClasses=ch=>`${ch.indent?'ind ':''}sp-${ch.spacing}`;
let edCountT=null;
function chNow(){const s=curSaga();if(!s)return null;const f=findChap(s,rTop().id);return f?f.ch:null}
function renderChap(r){
  const s=curSaga();if(!s){route=[{v:'lib'}];render();return}
  const f=findChap(s,r.id);if(!f){route.pop();render();return}
  const{book,ch}=f;
  state.meta.currentBook=book.id;ensureSession(book);
  snapshot(ch,false);
  view().innerHTML=`<div class="wrap-n">
    <div class="ed-head">
      <input class="ch-title" id="chTitle" value="${esc(ch.title)}" aria-label="Título del capítulo">
      <button class="iconb" title="Modo lectura" onclick="openReader()">Aa</button>
      <button class="iconb" title="Modo concentración" onclick="openFocus()">⛶</button>
      <button class="iconb" title="Panel del capítulo" onclick="openDrawer()">☰</button>
    </div>
    <div class="ed-tools">
      <button class="tb bld" data-c="bold" title="Negrita">B</button>
      <button class="tb itl" data-c="italic" title="Cursiva">I</button>
      <button class="tb und" data-c="underline" title="Subrayado">U</button>
      <button class="tb" id="tbH" title="Título de sección">T</button>
      <button class="tb ${ch.indent?'on':''}" id="tbInd" title="Sangría de primera línea">⇥</button>
      <select id="tbSp" title="Espaciado">${['compacto','normal','amplio'].map(x=>`<option value="${x}" ${ch.spacing===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select>
      <button class="tb" id="tbFind" title="Buscar y reemplazar">⌕</button>
      <span class="ed-count" id="edCount"></span>
    </div>
    <div id="findBar" hidden>
      <input type="text" id="fbQ" placeholder="Buscar">
      <input type="text" id="fbR" placeholder="Reemplazar por">
      <label><input type="checkbox" id="fbCase" checked>ignorar mayúsculas</label>
      <button class="btn btn-s" onclick="fbCount()">Contar</button>
      <button class="btn btn-s" onclick="fbReplace()">Reemplazar todo</button>
      <button class="iconb" style="width:30px;height:30px" title="Cerrar" onclick="$('#findBar').hidden=true">✕</button>
    </div>
    <div id="ed" contenteditable="true" class="${edClasses(ch)}" aria-label="Texto del capítulo"></div>
  </div>`;
  const ed=$('#ed');ed.innerHTML=ch.body||'<p><br></p>';
  updCount(ch);
  $('#chTitle').oninput=e=>{ch.title=e.target.value;ch.updated=Date.now();book.updated=Date.now();scheduleSave()};
  ed.addEventListener('input',()=>{
    ch.body=ed.innerHTML;ch.updated=Date.now();book.updated=Date.now();scheduleSave();
    clearTimeout(edCountT);edCountT=setTimeout(()=>updCount(ch),350);
  });
  for(const b of $$('.ed-tools .tb[data-c]')){
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.onclick=()=>{ed.focus();document.execCommand(b.dataset.c)};
  }
  const tbH=$('#tbH');
  tbH.addEventListener('mousedown',e=>e.preventDefault());
  tbH.onclick=()=>{ed.focus();
    const cur=(document.queryCommandValue('formatBlock')||'').toLowerCase();
    document.execCommand('formatBlock',false,cur==='h3'?'p':'h3');
  };
  $('#tbInd').onclick=()=>{ch.indent=!ch.indent;$('#tbInd').classList.toggle('on',ch.indent);ed.className=edClasses(ch);scheduleSave()};
  $('#tbSp').onchange=e=>{ch.spacing=e.target.value;ed.className=edClasses(ch);scheduleSave()};
  $('#tbFind').onclick=()=>{const fb=$('#findBar');fb.hidden=!fb.hidden;if(!fb.hidden)$('#fbQ').focus()};
}
function updCount(ch){const el=$('#edCount');if(!el)return;const w=countWords(ch.body);el.textContent=`${fmtN(w)} palabras · ${readMins(w)} min`}
document.addEventListener('selectionchange',()=>{
  const ed=$('#ed');if(!ed)return;
  const ae=document.activeElement;
  if(ae!==ed&&!ed.contains(ae))return;
  for(const b of $$('.ed-tools .tb[data-c]')){
    try{b.classList.toggle('on',document.queryCommandState(b.dataset.c))}catch(e){}
  }
  const h=$('#tbH');
  if(h){try{h.classList.toggle('on',(document.queryCommandValue('formatBlock')||'').toLowerCase()==='h3')}catch(e){}}
});
/* Buscar y reemplazar sobre nodos de texto */
function textNodes(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const a=[];let n;while(n=w.nextNode())a.push(n);return a}
function fbRegex(){
  const q=$('#fbQ').value;if(!q)return null;
  const e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp(e,'g'+($('#fbCase').checked?'i':''));
}
function fbCount(){
  const re=fbRegex();if(!re){toast('Escribe algo que buscar');return}
  let n=0;for(const t of textNodes($('#ed')))n+=(t.nodeValue.match(re)||[]).length;
  toast(n===1?'1 coincidencia':`${n} coincidencias`);
}
function fbReplace(){
  const re=fbRegex();if(!re){toast('Escribe algo que buscar');return}
  const rep=$('#fbR').value;let n=0;
  for(const t of textNodes($('#ed'))){
    const m=t.nodeValue.match(re);
    if(m){n+=m.length;t.nodeValue=t.nodeValue.replace(re,rep)}
  }
  const ch=chNow();
  if(ch){ch.body=$('#ed').innerHTML;ch.updated=Date.now();scheduleSave();updCount(ch)}
  toast(n===1?'1 reemplazo':`${n} reemplazos`);
}
/* Lector y concentración */
function openReader(){
  const ch=chNow();if(!ch)return;
  const ov=document.createElement('div');
  ov.className='ovl'+(ch.indent?' ind':'');
  ov.innerHTML=`<button class="btn ovl-close">✕ Cerrar</button><div class="inner"><h1>${esc(ch.title)}</h1>${ch.body}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  openOverlay(close);
  ov.querySelector('.ovl-close').onclick=()=>closeOverlayUI(close);
}
function openFocus(){
  document.body.classList.add('focusmode');
  try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}catch(e){}
  const x=document.createElement('button');
  x.className='btn ovl-close';x.style.zIndex='70';x.textContent='✕ Salir';
  document.body.appendChild(x);
  const close=()=>{
    document.body.classList.remove('focusmode');x.remove();
    try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  };
  openOverlay(close);
  x.onclick=()=>closeOverlayUI(close);
}
/* Panel lateral */
let drawerTab='links';
const expScenes=new Set();
window._drawerClose=null;
function openDrawer(){
  drawerTab='links';
  const bd=document.createElement('div');bd.id='backdrop';
  const dr=document.createElement('div');dr.id='drawer';
  document.body.append(bd,dr);
  const close=()=>{bd.remove();dr.remove();window._drawerClose=null};
  window._drawerClose=close;
  openOverlay(close);
  bd.onclick=()=>closeOverlayUI(close);
  renderDrawer();
}
function setDrawerTab(t){drawerTab=t;renderDrawer()}
function renderDrawer(){
  const dr=$('#drawer');if(!dr)return;
  const s=curSaga(),f=findChap(s,rTop().id);if(!f)return;
  const{book,ch}=f;
  const body=drawerTab==='links'?drawLinks(s,book,ch):drawerTab==='scenes'?drawScenes(ch):drawInfo(ch);
  dr.innerHTML=`<div class="dtabs">
    <button class="${drawerTab==='links'?'on':''}" onclick="setDrawerTab('links')">Enlaces</button>
    <button class="${drawerTab==='scenes'?'on':''}" onclick="setDrawerTab('scenes')">Escenas</button>
    <button class="${drawerTab==='info'?'on':''}" onclick="setDrawerTab('info')">Info</button>
  </div><div id="drawerBody">${body}</div>`;
}
function drawLinks(s,book,ch){
  const cc=state.meta.catColors;
  const chip=(type,id,name,color)=>`<span class="chip click" onclick="openEntFromDrawer('${type==='characters'?'character':type==='places'?'place':'group'}','${id}')">
    <span class="cdot" style="background:${color}"></span>${esc(name)}
    <span class="x" onclick="event.stopPropagation();drawerRm('${type}','${id}')">✕</span></span>`;
  const linked=[];
  for(const l of ch.links){
    if(l.type==='characters'){const c=charById(s,l.id);if(c)linked.push(chip('characters',c.id,c.name,cc.characters))}
    else if(l.type==='places'){const p=placeById(s,l.id);if(p)linked.push(chip('places',p.id,p.name,cc.places))}
  }
  for(const g of s.groups)if(g.chapterIds.includes(ch.id))linked.push(chip('groups',g.id,g.name,cc.groups));
  const opt=(type,arr,label,taken)=>{
    const free=arr.filter(x=>!taken(x));
    return free.length?`<optgroup label="${label}">${free.map(x=>`<option value="${type}:${x.id}">${esc(x.name)}</option>`).join('')}</optgroup>`:'';
  };
  const addSel=`<select onchange="drawerAdd(this.value);this.value=''">
    <option value="">＋ Enlazar personaje, lugar o grupo…</option>
    ${opt('characters',s.characters,'Personajes',c=>ch.links.some(l=>l.type==='characters'&&l.id===c.id))}
    ${opt('places',s.places,'Lugares',p=>ch.links.some(l=>l.type==='places'&&l.id===p.id))}
    ${opt('groups',s.groups,'Grupos',g=>g.chapterIds.includes(ch.id))}
  </select>`;
  const tags=ch.tagIds.map(id=>s.tags.find(t=>t.id===id)).filter(Boolean)
    .map(t=>`<span class="chip"><span class="cdot" style="background:${t.color}"></span>${esc(t.name)}<span class="x" onclick="drawerRmTag('${t.id}')">✕</span></span>`).join('');
  const freeTags=s.tags.filter(t=>!ch.tagIds.includes(t.id));
  const hitos=allHitosLinking(s,ch.id).map(({h})=>`<span class="chip"><span class="cdot" style="background:${h.kind==='evento'?'#3F5AA6':'#C9A227'}"></span>${esc(h.title)}${h.anchor?` · ${esc(h.anchor)}`:''}</span>`).join('');
  return `<div class="stack">
    <div class="field"><span class="lbl">Estado del capítulo</span>
      <select onchange="chSet('status',this.value)">${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${ch.status===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Acto</span>
      <select onchange="chSetAct(this.value)"><option value="">Sin acto</option>
      ${[...book.acts].sort((a,b)=>a.order-b.order).map(a=>`<option value="${a.id}" ${ch.actId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Vínculos</span>
      <div class="chips" style="margin-bottom:8px">${linked.join('')||'<span class="muted small">Sin vínculos.</span>'}</div>${addSel}</div>
    <div class="field"><span class="lbl">Etiquetas</span>
      <div class="chips" style="margin-bottom:8px">${tags||'<span class="muted small">Sin etiquetas.</span>'}</div>
      ${freeTags.length?`<select onchange="drawerAddTag(this.value);this.value=''"><option value="">＋ Añadir etiqueta…</option>${freeTags.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>`:''}</div>
    <div class="field"><span class="lbl">Hitos que enlazan este capítulo</span>
      <div class="chips">${hitos||'<span class="muted small">Ninguno. Se enlazan desde cada hito.</span>'}</div></div>
    <div class="field"><span class="lbl">Imagen del capítulo</span>
      ${ch.image?`<img src="${ch.image}" alt="" style="max-width:100%;border-radius:10px;margin-bottom:8px">`:''}
      <div class="row"><button class="btn btn-s" onclick="chImgPick()">${ch.image?'Cambiar':'Añadir'} imagen</button>
      ${ch.image?'<button class="btn btn-s" onclick="chImgRm()">Quitar</button>':''}</div></div>
  </div>`;
}
function chSet(k,v){const ch=chNow();if(!ch)return;ch[k]=v;ch.updated=Date.now();scheduleSave()}
function chSetAct(v){chSet('actId',v||null)}
function drawerAdd(v){
  if(!v)return;
  const[type,id]=v.split(':');const ch=chNow(),s=curSaga();
  if(type==='groups'){const g=s.groups.find(g=>g.id===id);if(g&&!g.chapterIds.includes(ch.id))g.chapterIds.push(ch.id)}
  else if(!ch.links.some(l=>l.type===type&&l.id===id))ch.links.push({type,id});
  scheduleSave();renderDrawer();
}
function drawerRm(type,id){
  const ch=chNow(),s=curSaga();
  if(type==='groups'){const g=s.groups.find(g=>g.id===id);if(g)g.chapterIds=g.chapterIds.filter(x=>x!==ch.id)}
  else ch.links=ch.links.filter(l=>!(l.type===type&&l.id===id));
  scheduleSave();renderDrawer();
}
function drawerAddTag(id){if(!id)return;const ch=chNow();if(!ch.tagIds.includes(id))ch.tagIds.push(id);scheduleSave();renderDrawer()}
function drawerRmTag(id){const ch=chNow();ch.tagIds=ch.tagIds.filter(x=>x!==id);scheduleSave();renderDrawer()}
function chImgPick(){pickImage(u=>{chSet('image',u);renderDrawer()})}
function chImgRm(){chSet('image',null);renderDrawer()}
function openEntFromDrawer(kind,id,ctx){if(window._drawerClose)closeOverlayUI(window._drawerClose);openEnt(kind,id,ctx)}
/* Escenas */
function drawScenes(ch){
  return `<div>${ch.scenes.map((sc,i)=>{
    const open=expScenes.has(sc.id);
    return `<div class="scene"><div class="sh">
      <b onclick="toggleScene('${sc.id}')">${esc(sc.title)||'Escena'}</b>
      <button class="mini" ${i===0?'disabled':''} onclick="mvScene(${i},-1)">↑</button>
      <button class="mini" ${i===ch.scenes.length-1?'disabled':''} onclick="mvScene(${i},1)">↓</button>
      <button class="mini" onclick="delScene('${sc.id}')">✕</button></div>
      ${open?`<div class="stack" style="gap:8px;margin-top:8px">
        <input value="${esc(sc.title)}" placeholder="Título de la escena" oninput="updScene('${sc.id}','title',this.value)">
        <textarea placeholder="Notas o texto de apoyo…" oninput="updScene('${sc.id}','note',this.value)">${esc(sc.note)}</textarea>
      </div>`:''}
    </div>`}).join('')||'<p class="muted small">Sin escenas. Divide el capítulo en escenas para planificarlo.</p>'}
  <button class="btn" style="margin-top:10px" onclick="addScene()">＋ Escena</button></div>`;
}
function toggleScene(id){expScenes.has(id)?expScenes.delete(id):expScenes.add(id);renderDrawer()}
function addScene(){const ch=chNow();const sc={id:uid(),title:`Escena ${ch.scenes.length+1}`,note:''};ch.scenes.push(sc);expScenes.add(sc.id);scheduleSave();renderDrawer()}
function updScene(id,k,v){const sc=chNow().scenes.find(s=>s.id===id);if(sc){sc[k]=v;scheduleSave()}}
function mvScene(i,d){const a=chNow().scenes,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];scheduleSave();renderDrawer()}
function delScene(id){const ch=chNow();ch.scenes=ch.scenes.filter(s=>s.id!==id);scheduleSave();renderDrawer()}
/* Info y versiones */
function drawInfo(ch){
  const w=countWords(ch.body);
  const vs=[...ch.versions].reverse();
  return `<p class="small muted num">${fmtN(w)} palabras · ${readMins(w)} min de lectura</p>
    <h3 style="margin:16px 0 6px">Versiones <span class="muted small">(máx. 8)</span></h3>
    ${vs.map(v=>`<div class="vrow"><span>${fmtDT(v.ts)}</span><span class="num" style="flex:none">${fmtN(countWords(v.body))} pal.</span>
      <button class="btn btn-s" onclick="restoreVersion(${v.ts})">Restaurar</button></div>`).join('')||'<p class="muted small">Sin versiones guardadas.</p>'}
    <button class="btn" style="margin-top:10px" onclick="saveVersionNow()">Guardar versión ahora</button>
    <div style="margin-top:28px;border-top:1px solid var(--line);padding-top:16px">
      <button class="btn btn-d" onclick="delChapter()">Eliminar capítulo</button></div>`;
}
function restoreVersion(ts){
  const ch=chNow();const v=ch.versions.find(v=>v.ts===ts);if(!v)return;
  snapshot(ch,true);
  ch.body=v.body;ch.updated=Date.now();scheduleSave();
  const ed=$('#ed');if(ed)ed.innerHTML=ch.body||'<p><br></p>';
  updCount(ch);renderDrawer();toast('Versión restaurada');
}
function saveVersionNow(){snapshot(chNow(),true);renderDrawer();toast('Versión guardada')}
async function delChapter(){
  const s=curSaga(),f=findChap(s,rTop().id);if(!f)return;
  if(!await askConfirm(`Eliminar el capítulo «${f.ch.title}». Podrás restaurarlo desde la papelera durante 30 días.`))return;
  toTrash('chapter',f.ch.title,{sagaId:s.id,bookId:f.book.id},f.ch);
  f.book.chapters=f.book.chapters.filter(c=>c.id!==f.ch.id);
  scheduleSave();toast('Capítulo eliminado (papelera)');
  if(window._drawerClose)closeOverlayUI(window._drawerClose);
  goBack();
}

/* ═══════════ Checklists de capítulos ═══════════ */
function toggleChapLink(chId,type,entId,on){
  const s=curSaga(),f=findChap(s,chId);if(!f)return;
  const L=f.ch.links;
  if(on){if(!L.some(l=>l.type===type&&l.id===entId))L.push({type,id:entId})}
  else f.ch.links=L.filter(l=>!(l.type===type&&l.id===entId));
  scheduleSave();
}
function bookChecklist(type,entId){
  const b=curBook();
  if(!b)return '<p class="muted small">Abre un libro para enlazar capítulos.</p>';
  if(!b.chapters.length)return '<p class="muted small">Este libro aún no tiene capítulos.</p>';
  return `<div class="check-list">${b.chapters.map(c=>`<label>
    <input type="checkbox" ${c.links.some(l=>l.type===type&&l.id===entId)?'checked':''} onchange="toggleChapLink('${c.id}','${type}','${entId}',this.checked)"><span>${esc(c.title)}</span></label>`).join('')}</div>`;
}
function entOfKind(kind,id,ctx){
  const s=curSaga();
  if(kind==='group')return s.groups.find(g=>g.id===id);
  if(kind==='egg')return s.easterEggs.find(e=>e.id===id);
  if(kind==='hito'){const tl=s.timelines.find(t=>t.id===ctx);return tl&&tl.hitos.find(h=>h.id===id)}
  return null;
}
function toggleEntChap(kind,entId,ctx,chId,on){
  const e=entOfKind(kind,entId,ctx);if(!e)return;
  if(on){if(!e.chapterIds.includes(chId))e.chapterIds.push(chId)}
  else e.chapterIds=e.chapterIds.filter(x=>x!==chId);
  scheduleSave();
}
function sagaChecklist(kind,entId,ctx){
  const s=curSaga(),e=entOfKind(kind,entId,ctx);
  if(!s.books.some(b=>b.chapters.length))return '<p class="muted small">La saga aún no tiene capítulos.</p>';
  return `<div class="check-list">${s.books.map(b=>
    (s.books.length>1?`<div class="grp">${esc(b.name)}</div>`:'')+
    b.chapters.map(c=>`<label><input type="checkbox" ${e.chapterIds.includes(c.id)?'checked':''} onchange="toggleEntChap('${kind}','${entId}','${ctx||''}','${c.id}',this.checked)"><span>${esc(c.title)}</span></label>`).join('')
  ).join('')}</div>`;
}

/* ═══════════ Editores de entidades ═══════════ */
function openEnt(kind,id,ctx){go({v:'ent',kind,id,ctx:ctx||null})}
function renderEnt(r){
  const s=curSaga();if(!s){route=[{v:'lib'}];render();return}
  const F={character:entChar,place:entPlace,group:entGroup,hito:entHito,egg:entEgg,word:entWord,act:entAct}[r.kind];
  if(!F){goBack();return}
  const html=F(s,r);
  if(html===null){route.pop();render();return}
  view().innerHTML=`<div class="wrap-n stack">${html}</div>`;
}
/* — Personaje — */
function entChar(s,r){
  const c=charById(s,r.id);if(!c)return null;
  const others=s.characters.filter(x=>x.id!==c.id);
  const freeRel=others.filter(x=>!c.rels.includes(x.id));
  const groups=s.groups.filter(g=>g.members.includes(c.id));
  return `
    <div class="row">${c.image?`<img src="${c.image}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:12px">`:''}
      <button class="btn btn-s" onclick="charImg('${c.id}')">${c.image?'Cambiar':'Añadir'} imagen</button>
      ${c.image?`<button class="btn btn-s" onclick="charImgRm('${c.id}')">Quitar</button>`:''}</div>
    <div class="field"><span class="lbl">Nombre</span><input value="${esc(c.name)}" oninput="updChar('${c.id}','name',this.value)"></div>
    <div class="field"><span class="lbl">Rol</span><input value="${esc(c.role)}" placeholder="Protagonista, antagonista…" oninput="updChar('${c.id}','role',this.value)"></div>
    ${state.meta.charFields.map(f=>`<div class="field"><span class="lbl">${esc(f.label)}</span>
      <input value="${esc(c.fields[f.id]||'')}" oninput="updCharF('${c.id}','${f.id}',this.value)"></div>`).join('')}
    <div class="field"><span class="lbl">Descripción</span><textarea oninput="updChar('${c.id}','body',this.value)">${esc(c.body)}</textarea></div>
    <div class="field"><span class="lbl">Relaciones</span>
      <div class="chips" style="margin-bottom:8px">${c.rels.map(id=>{const o=charById(s,id);return o?`<span class="chip click" onclick="openEnt('character','${o.id}')">${esc(o.name)}<span class="x" onclick="event.stopPropagation();rmRel('${c.id}','${o.id}')">✕</span></span>`:''}).join('')||'<span class="muted small">Sin relaciones.</span>'}</div>
      ${freeRel.length?`<select onchange="addRel('${c.id}',this.value);this.value=''"><option value="">＋ Añadir relación…</option>${freeRel.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>`:''}</div>
    <div class="field"><span class="lbl">Grupos</span>
      <div class="chips">${groups.map(g=>`<span class="chip click" onclick="openEnt('group','${g.id}')">${esc(g.name)}</span>`).join('')||'<span class="muted small">No pertenece a ningún grupo.</span>'}</div></div>
    <div class="field"><span class="lbl">Aparece en los capítulos (libro actual)</span>${bookChecklist('characters',c.id)}</div>
    <div class="row"><button class="btn" onclick="dupChar('${c.id}')">Duplicar</button>
      <button class="btn btn-d" onclick="delChar('${c.id}')">Eliminar</button></div>`;
}
function updChar(id,k,v){const c=charById(curSaga(),id);if(c){c[k]=v;scheduleSave()}}
function updCharF(id,fid,v){const c=charById(curSaga(),id);if(c){c.fields[fid]=v;scheduleSave()}}
function charImg(id){pickImage(u=>{charById(curSaga(),id).image=u;scheduleSave();render()})}
function charImgRm(id){charById(curSaga(),id).image=null;scheduleSave();render()}
function addRel(id,other){
  if(!other)return;
  const s=curSaga(),a=charById(s,id),b=charById(s,other);
  if(!a||!b)return;
  if(!a.rels.includes(other))a.rels.push(other);
  if(!b.rels.includes(id))b.rels.push(id);
  scheduleSave();render();
}
function rmRel(id,other){
  const s=curSaga(),a=charById(s,id),b=charById(s,other);
  if(a)a.rels=a.rels.filter(x=>x!==other);
  if(b)b.rels=b.rels.filter(x=>x!==id);
  scheduleSave();render();
}
function dupChar(id){
  const s=curSaga(),c=charById(s,id);
  const n=JSON.parse(JSON.stringify(c));
  n.id=uid();n.name=c.name+' (copia)';
  for(const rid of n.rels){const o=charById(s,rid);if(o&&!o.rels.includes(n.id))o.rels.push(n.id)}
  s.characters.push(n);scheduleSave();toast('Personaje duplicado');
  openEnt('character',n.id);
}
async function delChar(id){
  const s=curSaga(),c=charById(s,id);
  if(!await askConfirm(`Eliminar el personaje «${c.name}».`))return;
  for(const o of s.characters)o.rels=o.rels.filter(x=>x!==id);
  for(const g of s.groups)g.members=g.members.filter(x=>x!==id);
  for(const b of s.books)for(const ch of b.chapters)ch.links=ch.links.filter(l=>!(l.type==='characters'&&l.id===id));
  toTrash('character',c.name,{sagaId:s.id},c);
  s.characters=s.characters.filter(x=>x.id!==id);
  scheduleSave();toast('Personaje eliminado (papelera)');goBack();
}
/* — Ubicación — */
function entPlace(s,r){
  const p=placeById(s,r.id);if(!p)return null;
  const banned=placeDescendants(s,p.id);banned.add(p.id);
  const opts=s.places.filter(x=>!banned.has(x.id));
  return `
    <div class="field"><span class="lbl">Nombre</span><input value="${esc(p.name)}" oninput="updPlace('${p.id}','name',this.value)"></div>
    <div class="field"><span class="lbl">Dentro de</span>
      <select onchange="setPlaceParent('${p.id}',this.value)"><option value="">— Raíz —</option>
      ${opts.map(x=>`<option value="${x.id}" ${p.parentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Descripción</span><textarea oninput="updPlace('${p.id}','body',this.value)">${esc(p.body)}</textarea></div>
    <div class="field"><span class="lbl">Aparece en los capítulos (libro actual)</span>${bookChecklist('places',p.id)}</div>
    <div class="row"><button class="btn" onclick="addPlace('${p.id}')">＋ Crear sub-lugar</button>
      <button class="btn btn-d" onclick="delPlace('${p.id}')">Eliminar</button></div>
    <p class="muted small">Al eliminar una ubicación, sus sub-lugares suben un nivel.</p>`;
}
function updPlace(id,k,v){const p=placeById(curSaga(),id);if(p){p[k]=v;scheduleSave()}}
function setPlaceParent(id,v){const p=placeById(curSaga(),id);p.parentId=v||null;scheduleSave()}
async function delPlace(id){
  const s=curSaga(),p=placeById(s,id);
  if(!await askConfirm(`Eliminar la ubicación «${p.name}». Sus sub-lugares subirán un nivel.`))return;
  for(const x of s.places)if(x.parentId===id)x.parentId=p.parentId;
  for(const b of s.books)for(const ch of b.chapters)ch.links=ch.links.filter(l=>!(l.type==='places'&&l.id===id));
  toTrash('place',p.name,{sagaId:s.id},p);
  s.places=s.places.filter(x=>x.id!==id);
  scheduleSave();toast('Ubicación eliminada (papelera)');goBack();
}
/* — Grupo — */
function entGroup(s,r){
  const g=s.groups.find(x=>x.id===r.id);if(!g)return null;
  const free=s.characters.filter(c=>!g.members.includes(c.id));
  return `
    <div class="field"><span class="lbl">Nombre</span><input value="${esc(g.name)}" oninput="updGroup('${g.id}','name',this.value)"></div>
    <div class="field"><span class="lbl">Descripción</span><textarea oninput="updGroup('${g.id}','body',this.value)">${esc(g.body)}</textarea></div>
    <div class="field"><span class="lbl">Miembros</span>
      <div class="chips" style="margin-bottom:8px">${g.members.map(id=>{const c=charById(s,id);return c?`<span class="chip click" onclick="openEnt('character','${c.id}')">${esc(c.name)}<span class="x" onclick="event.stopPropagation();rmMember('${g.id}','${c.id}')">✕</span></span>`:''}).join('')||'<span class="muted small">Sin miembros.</span>'}</div>
      ${free.length?`<select onchange="addMember('${g.id}',this.value);this.value=''"><option value="">＋ Añadir miembro…</option>${free.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:''}</div>
    <div class="field"><span class="lbl">Aparece en los capítulos (toda la saga)</span>${sagaChecklist('group',g.id)}</div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delGroup('${g.id}')">Eliminar</button>`;
}
function updGroup(id,k,v){const g=curSaga().groups.find(x=>x.id===id);if(g){g[k]=v;scheduleSave()}}
function addMember(gid,cid){if(!cid)return;const g=curSaga().groups.find(x=>x.id===gid);if(!g.members.includes(cid))g.members.push(cid);scheduleSave();render()}
function rmMember(gid,cid){const g=curSaga().groups.find(x=>x.id===gid);g.members=g.members.filter(x=>x!==cid);scheduleSave();render()}
async function delGroup(id){
  const s=curSaga(),g=s.groups.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el grupo «${g.name}».`))return;
  toTrash('group',g.name,{sagaId:s.id},g);
  s.groups=s.groups.filter(x=>x.id!==id);
  scheduleSave();toast('Grupo eliminado (papelera)');goBack();
}
/* — Hito — */
function entHito(s,r){
  const h=entOfKind('hito',r.id,r.ctx);if(!h)return null;
  return `
    <div class="field"><span class="lbl">Título</span><input value="${esc(h.title)}" oninput="updHito('${r.ctx}','${h.id}','title',this.value)"></div>
    <div class="row">
      <div class="field" style="flex:1"><span class="lbl">Tipo</span>

          <option value="evento" ${h.kind==='evento'?'selected':''}>Evento (con duración)</option>
          <option value="momento" ${h.kind==='momento'?'selected':''}>Momento (instante)</option></select></div>
      <div class="field" style="width:110px"><span class="lbl">Orden</span>

    <div class="field"><span class="lbl">Ancla temporal</span>

    <div class="field"><span class="lbl">Descripción</span><textarea oninput="updHito('${r.ctx}','${h.id}','body',this.value)">${esc(h.body)}</textarea></div>
    <div class="field"><span class="lbl">Capítulos que transcurren en este hito (toda la saga)</span>${sagaChecklist('hito',h.id,r.ctx)}</div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delHito('${r.ctx}','${h.id}')">Eliminar</button>`;
}
function updHito(tlId,id,k,v){const h=entOfKind('hito',id,tlId);if(h){h[k]=v;scheduleSave()}}
function updHitoOrder(tlId,id,v){const n=parseInt(v,10);if(!isNaN(n))updHito(tlId,id,'order',n)}
async function delHito(tlId,id){
  const s=curSaga(),tl=s.timelines.find(t=>t.id===tlId),h=entOfKind('hito',id,tlId);
  if(!await askConfirm(`Eliminar el hito «${h.title}».`))return;
  toTrash('hito',h.title,{sagaId:s.id,tlId},h);
  tl.hitos=tl.hitos.filter(x=>x.id!==id);
  scheduleSave();toast('Hito eliminado (papelera)');goBack();
}
/* — Easter egg — */
function entEgg(s,r){
  const e=s.easterEggs.find(x=>x.id===r.id);if(!e)return null;
  return `
    <div class="field"><span class="lbl">Título</span><input value="${esc(e.title)}" oninput="updEgg('${e.id}','title',this.value)"></div>
    <div class="field"><span class="lbl">Contenido</span><textarea oninput="updEgg('${e.id}','body',this.value)">${esc(e.body)}</textarea></div>
    <div class="field"><span class="lbl">Vive en los capítulos (toda la saga)</span>${sagaChecklist('egg',e.id)}</div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delEgg('${e.id}')">Eliminar</button>`;
}
function updEgg(id,k,v){const e=curSaga().easterEggs.find(x=>x.id===id);if(e){e[k]=v;scheduleSave()}}
async function delEgg(id){
  const s=curSaga(),e=s.easterEggs.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el secreto «${e.title}».`))return;
  toTrash('egg',e.title,{sagaId:s.id},e);
  s.easterEggs=s.easterEggs.filter(x=>x.id!==id);
  scheduleSave();toast('Easter egg eliminado (papelera)');goBack();
}
/* — Palabra — */
function entWord(s,r){
  const l=s.languages.find(x=>x.id===r.ctx);if(!l)return null;
  const w=l.words.find(x=>x.id===r.id);if(!w)return null;
  return `
    <div class="field"><span class="lbl">Término (${esc(l.name)})</span><input value="${esc(w.term)}" oninput="updWord('${r.ctx}','${w.id}','term',this.value)"></div>
    <div class="field"><span class="lbl">Tipo gramatical</span><input value="${esc(w.type)}" placeholder="sustantivo, verbo…" oninput="updWord('${r.ctx}','${w.id}','type',this.value)"></div>
    <div class="field"><span class="lbl">Significado</span><input value="${esc(w.meaning)}" oninput="updWord('${r.ctx}','${w.id}','meaning',this.value)"></div>
    <div class="field"><span class="lbl">Notas</span><textarea placeholder="Pronunciación, uso…" oninput="updWord('${r.ctx}','${w.id}','notes',this.value)">${esc(w.notes)}</textarea></div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delWord('${r.ctx}','${w.id}')">Eliminar</button>`;
}
function updWord(langId,id,k,v){const l=curSaga().languages.find(x=>x.id===langId);const w=l&&l.words.find(x=>x.id===id);if(w){w[k]=v;scheduleSave()}}
async function delWord(langId,id){
  const s=curSaga(),l=s.languages.find(x=>x.id===langId),w=l.words.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar la palabra «${w.term||'(sin término)'}».`))return;
  toTrash('word',w.term||'(sin término)',{sagaId:s.id,langId},w);
  l.words=l.words.filter(x=>x.id!==id);
  scheduleSave();toast('Palabra eliminada (papelera)');goBack();
}
/* — Acto — */
function entAct(s,r){
  const b=curBook();if(!b)return null;
  const a=b.acts.find(x=>x.id===r.id);if(!a)return null;
  return `
    <div class="field"><span class="lbl">Nombre</span><input value="${esc(a.name)}" oninput="updAct('${a.id}','name',this.value)"></div>
    <div class="field" style="width:130px"><span class="lbl">Orden</span>
      <input type="number" value="${a.order}" onchange="updActOrder('${a.id}',this.value)"></div>
    <button class="btn btn-d" style="align-self:flex-start" onclick="delAct('${a.id}')">Eliminar</button>
    <p class="muted small">Al eliminar un acto, sus capítulos quedan sin asignar.</p>`;
}
function updAct(id,k,v){const a=curBook().acts.find(x=>x.id===id);if(a){a[k]=v;scheduleSave()}}
function updActOrder(id,v){const n=parseInt(v,10);if(!isNaN(n))updAct(id,'order',n)}
async function delAct(id){
  const s=curSaga(),b=curBook(),a=b.acts.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el acto «${a.name}». Sus capítulos quedarán sin asignar.`))return;
  for(const c of b.chapters)if(c.actId===id)c.actId=null;
  toTrash('act',a.name,{sagaId:s.id,bookId:b.id},a);
  b.acts=b.acts.filter(x=>x.id!==id);
  scheduleSave();toast('Acto eliminado (papelera)');goBack();
}

/* ═══════════ Ajustes ═══════════ */
function renderSettings(){
  const m=state.meta;
  const themeCards=Object.entries(THEMES).map(([id,t])=>`
    <button class="themecard ${m.themeId===id?'on':''}" onclick="setTheme('${id}')">
      <div class="sw"><i style="background:${t.v.ink}"></i><i style="background:${t.v.panel}"></i><i style="background:${t.v.lapis}"></i><i style="background:${t.v.text}"></i></div>
      <b>${t.name}</b> <span class="small muted">${t.dark?'oscuro':'claro'}</span></button>`).join('');
  const CATS=[['characters','Personajes'],['places','Ubicaciones'],['groups','Grupos'],['easterEggs','Easter eggs']];
  view().innerHTML=`<div class="wrap-n stack">
    <div><h2>Apariencia</h2>
      <div class="grid" style="margin:10px 0 16px">${themeCards}</div>
      <div class="row" style="margin-bottom:14px">
        <span class="lbl" style="margin:0">Acento</span>
        <input type="color" value="${m.accent||THEMES[m.themeId].v.lapis}" oninput="setAccent(this.value)">
        ${m.accent?'<button class="btn btn-s" onclick="clearAccent()">Quitar acento personalizado</button>':''}
      </div>
      <div class="row" style="margin-bottom:14px">
        <span class="lbl" style="margin:0">Tamaño de letra al escribir</span>
        <div class="seg">${[['s','S'],['m','M'],['l','L']].map(([k,l])=>`<button class="${m.fontScale===k?'on':''}" onclick="setFS('${k}')">${l}</button>`).join('')}</div>
      </div>
      <div class="row">
        <span class="lbl" style="margin:0">Velocidad de lectura (palabras/min)</span>
        <input type="number" min="80" max="600" value="${m.wpm}" style="width:100px" onchange="setWpm(this.value)">
      </div>
    </div>
    <div class="sect"><h2>Colores por categoría</h2>
      <div class="card">${CATS.map(([k,l])=>`<div class="trow">
        <input type="color" value="${m.catColors[k]}" oninput="setCatColor('${k}',this.value)">
        <div class="tinfo"><b>${l}</b></div></div>`).join('')}</div>
    </div>
    <div class="sect"><h2>Campos de personaje</h2>
      <div class="card">${m.charFields.map(f=>`<div class="trow">
        <div class="tinfo"><b style="cursor:pointer" onclick="renameField('${f.id}')">${esc(f.label)}</b></div>
        <button class="btn btn-s btn-d" onclick="delField('${f.id}')">Eliminar</button></div>`).join('')}
      <div style="padding-top:10px"><button class="btn btn-s" onclick="addField()">＋ Añadir campo</button></div></div>
    </div>
    <div class="sect"><h2>Copias de seguridad</h2>
      <div class="card stack" style="gap:10px">
        <p class="small muted">Última copia: <b>${m.lastBackup?fmtDT(m.lastBackup):'nunca'}</b>. Guarda copias con regularidad: son tu única red de seguridad.</p>
        <div class="row">
          <button class="btn btn-p" onclick="expJson()">Descargar copia .json</button>
          <button class="btn" onclick="expClone()">Descargar clon .html</button>
          <button class="btn" onclick="pickJsonImport()">Importar copia .json</button>
        </div>
        <p class="small muted">El clon .html es esta misma app con tus datos dentro: ábrelo en otro dispositivo y lo restaura todo.</p>
      </div>
    </div>
    <div class="sect"><h2>Papelera <span class="muted small num">${state.trash.length}/25 · 30 días</span></h2>
      <div class="card">${state.trash.map(t=>`<div class="trow">
        <div class="tinfo"><b>${esc(t.label)}</b><span>${TRASH_KINDS[t.kind]||t.kind} · ${fmtDT(t.ts)}</span></div>
        <button class="btn btn-s" onclick="restoreTrash('${t.id}')">Restaurar</button></div>`).join('')||'<p class="muted small">La papelera está vacía.</p>'}
      ${state.trash.length?`<div style="padding-top:10px"><button class="btn btn-s btn-d" onclick="emptyTrash()">Vaciar papelera</button></div>`:''}</div>
    </div>
  </div>`;
}
function setTheme(id){state.meta.themeId=id;scheduleSave();applyTheme();render()}
function setAccent(v){state.meta.accent=v;scheduleSave();applyTheme()}
function clearAccent(){state.meta.accent=null;scheduleSave();applyTheme();render()}
function setFS(v){state.meta.fontScale=v;scheduleSave();applyTheme();render()}
function setWpm(v){const n=Math.min(600,Math.max(80,parseInt(v,10)||200));state.meta.wpm=n;scheduleSave();render()}
function setCatColor(k,v){state.meta.catColors[k]=v;scheduleSave()}
async function renameField(id){
  const f=state.meta.charFields.find(f=>f.id===id);
  const n=await askText('Renombrar campo',f.label);
  if(n){f.label=n;scheduleSave();render()}
}
async function delField(id){
  const f=state.meta.charFields.find(f=>f.id===id);
  if(!await askConfirm(`Eliminar el campo «${f.label}» de las fichas de personaje.`))return;
  state.meta.charFields=state.meta.charFields.filter(x=>x.id!==id);
  scheduleSave();render();
}
async function addField(){
  const n=await askText('Nuevo campo de personaje');
  if(n){state.meta.charFields.push({id:'f_'+uid(),label:n});scheduleSave();render()}
}
async function emptyTrash(){
  if(!await askConfirm('Vaciar la papelera de forma definitiva.'))return;
  state.trash=[];scheduleSave();render();toast('Papelera vaciada');
}

/* ═══════════ Arranque ═══════════ */
load();
applyTheme();
initDlg();
$('#btnBack').onclick=goBack;
$('#btnGear').onclick=()=>{if(rTop().v!=='settings')go({v:'settings'})};
if(curSaga()&&curBook()){
  ensureSession(curBook());
  route=[{v:'lib'},{v:'book',tab:'resumen'}];
  pushHist();
}
setDot('saved');
render();
</script>
