<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<title>Akharta — Taller de novela</title>
<script>
/* Red de seguridad: si algun script falla, muestra el error en pantalla (solo ASCII aqui). */
window.addEventListener('error',function(e){
  try{
    var d=document.getElementById('fatalbar');
    if(!d){
      d=document.createElement('div');
      d.id='fatalbar';
      d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#7a1f1f;color:#fff;padding:10px 14px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto';
      (document.body||document.documentElement).appendChild(d);
    }
    d.textContent+='ERROR: '+e.message+' [linea '+(e.lineno||'?')+']\n';
  }catch(x){}
});
</script>
<style>
:root{
  --ink:#0C0A09; --surface:#131110; --panel:#1C1917; --paper:#171412;
  --text:#EBE3D4; --muted:#9C9184; --line:#2E2822; --hover:#252019;
  --lapis:#C9A227; --lapis-soft:rgba(201,162,39,.16);
  --amber:#B4703F; --amber-soft:rgba(180,112,63,.16);
  --danger:#E07A6B; --ok:#7FB68A;
  --fs-ed:18.5px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--text);margin:0;padding:0}
body{font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* Altura fija (no min-): el scroll vive DENTRO de #view, que es contra lo que
   se anclan las barras pegajosas del editor. Con min-height el documento crecía,
   el scroll era del body y ningún sticky interno funcionaba. */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--lapis);outline-offset:1px;border-radius:4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=color]{padding:2px;width:44px;height:32px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--lapis)}
select{appearance:auto}
textarea{min-height:90px;max-height:70vh;overflow-y:auto;resize:none}
::placeholder{color:var(--muted);opacity:.7}
a{color:var(--lapis)}

/* ── Barra superior ── */
#topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--ink);border-bottom:1px solid var(--line)}
#btnBack{font-size:24px;line-height:1;width:38px;height:38px;border-radius:9px;color:var(--muted)}
#btnBack:hover{background:var(--hover);color:var(--text)}
#topTitle{flex:1;min-width:0;font-family:var(--serif);font-size:17px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topTitle.editable{cursor:pointer}
#saveDot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
#saveDot .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);transition:background .2s}
#saveDot.saving .dot{background:var(--muted)}
#saveDot.err .dot{background:var(--amber)}
#btnGear{font-size:19px;width:38px;height:38px;border-radius:9px;color:var(--muted)}
#btnGear:hover{background:var(--hover);color:var(--text)}

/* ── Estructura ── */
#shell{display:flex;flex:1;min-height:0}
#nav{width:232px;flex:none;border-right:1px solid var(--line);background:var(--surface);
  padding:14px 10px;display:flex;flex-direction:column;gap:4px}
#nav .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
#nav .brand svg{width:40px;height:40px;flex:none}
#nav .brand .bt{min-width:0}
#nav .brand .bt b{display:block;font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .brand .bt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navtab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:14.5px;text-align:left;width:100%}
.navtab .ic{font-size:16px;width:20px;text-align:center}
.navtab:hover{background:var(--hover);color:var(--text)}
.navtab.on{background:var(--lapis-soft);color:var(--lapis);font-weight:600}
#view{flex:1;min-width:0;overflow-y:auto;padding:20px 18px 40px}
.wrap{max-width:960px;margin:0 auto}
.wrap-n{max-width:780px;margin:0 auto}

@media (max-width:820px){
  #nav{position:fixed;left:0;right:0;bottom:0;width:auto;z-index:55;flex-direction:row;
    border-right:0;border-top:1px solid var(--line);padding:6px 8px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  #nav .brand{display:none}
  .navtab{flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;flex:1;align-items:center}
  .navtab .ic{font-size:19px;width:auto}
  #view{padding:16px 14px 110px}
  body.hasnav #view{padding-bottom:110px}
}

/* ── Componentes ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-p{background:var(--lapis);border-color:var(--lapis);color:var(--ink);font-weight:600}
.btn-p:hover{background:var(--lapis);filter:brightness(1.08)}
.btn-d{color:var(--danger);border-color:var(--line)}
.btn-d:hover{background:rgba(224,122,107,.12)}
.btn-s{padding:5px 10px;font-size:13px}
.iconb{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);border:1px solid var(--line);background:var(--panel)}
.iconb:hover{background:var(--hover);color:var(--text)}
.iconb.on{background:var(--lapis-soft);color:var(--lapis);border-color:var(--lapis)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.grid-w{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.lbl{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.25}
h2{font-size:21px;margin-bottom:4px}
h3{font-size:16.5px}
.sect{margin-top:26px}
.sect>h2{margin-bottom:12px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;max-width:100%}
.chip.click{cursor:pointer}
.chip.click:hover{background:var(--hover)}
.chip .x{color:var(--muted);font-size:14px;padding:0 2px;cursor:pointer}
.chip .x:hover{color:var(--danger)}
.chip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}

.subchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.subchips .sc{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--muted)}
.subchips .sc.on{background:var(--lapis-soft);border-color:var(--lapis);color:var(--lapis);font-weight:600}

.searchrow{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.searchrow input{flex:1}

.bar{height:9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lapis);border-radius:999px;transition:width .3s}

.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.stat b{display:block;font-size:21px;font-family:var(--serif);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.field{margin-bottom:14px}
.check-list{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto;
  border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.check-list label{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;font-size:14px;cursor:pointer}
.check-list label:hover{background:var(--hover)}
.check-list .grp{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 8px 3px}

/* ── Biblioteca ── */
.lib-hero{text-align:center;padding:26px 0 22px}
.lib-hero svg{width:84px;height:84px}
.lib-hero h1{font-size:34px;letter-spacing:.24em;margin-top:12px;font-weight:600}
.lib-hero .sub{color:var(--muted);letter-spacing:.34em;text-transform:uppercase;font-size:12px;margin-top:2px}
.saga-name{font-family:var(--serif);font-size:19px;font-weight:600;cursor:pointer;border-radius:6px;padding:2px 6px;margin-left:-6px}
.saga-name:hover{background:var(--hover)}
.bookcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.bookcard:hover{border-color:var(--lapis)}
.bookcard .cov{aspect-ratio:2/2.6;background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:44px;color:var(--lapis);border-bottom:1px solid var(--line)}
.bookcard .cov img{width:100%;height:100%;object-fit:cover}
.bookcard .bi{padding:10px 12px}
.bookcard .bi b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:3px}
.bookcard .bi .small{color:var(--muted)}
.estado{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.estado.en_marcha{color:var(--lapis);border-color:var(--lapis)}
.estado.revision{color:var(--amber);border-color:var(--amber)}
.estado.terminado{color:var(--ok);border-color:var(--ok)}

/* ── Resumen ── */
.hero{display:flex;gap:18px;align-items:flex-start}
.hero .cov{width:110px;flex:none;aspect-ratio:2/2.6;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:40px;color:var(--lapis);overflow:hidden}
.hero .cov img{width:100%;height:100%;object-fit:cover}
.hero h2{font-size:26px}
.watermark{position:relative}
.watermark>svg.wm{position:absolute;right:0;top:0;width:150px;height:150px;opacity:.05;pointer-events:none}

/* ── Capítulos ── */
.chapcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.chapcard:hover{border-color:var(--lapis)}
.chapcard .img{aspect-ratio:3/2;background:var(--surface);border-bottom:1px solid var(--line)}
.chapcard .img img{width:100%;height:100%;object-fit:cover;display:block}
.ch-image{display:block;width:100%;border-radius:10px;margin-bottom:8px;aspect-ratio:3/2;object-fit:cover;background:var(--surface)}
.chapcard .ci{padding:11px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.chapcard .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.chapcard .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.chapcard b{font-family:var(--serif);font-size:15.5px}
.chapcard .ext{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reorder-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.reorder-row b{flex:1;font-family:var(--serif);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Mundo ── */
.entcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.entcard:hover{border-color:var(--lapis)}
.entcard b{font-family:var(--serif);font-size:15.5px;display:block;margin-bottom:3px}
.entcard .desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entcard img{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.tree{list-style:none}
.tree ul{list-style:none;margin-left:20px;border-left:1px solid var(--line);padding-left:8px}
.tnode{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px}
.tnode:hover{background:var(--hover)}
.tnode .caret{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;transition:transform .15s}
.tnode .caret.open{transform:rotate(90deg)}
.tnode{align-items:flex-start}
.tnode .caret{margin-top:2px}
.tnode .tn{flex:1;min-width:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:3px 0}
.tnode .tn .tn-name{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .tn .tn-desc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Cronología ── */
.tl-axis{position:relative;padding-left:26px}
.tl-axis:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.hito{position:relative;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer}
.hito:hover{border-color:var(--lapis)}
.hito .node{position:absolute;left:-23px;top:16px;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink)}
.hito .anchor{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hito b{font-family:var(--serif);font-size:15.5px;display:block;margin:2px 0 4px}

/* ── Logros ── */
.badge{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;opacity:.45}
.badge.won{opacity:1;border-color:var(--lapis)}
.badge .bic{font-size:22px;width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line)}
.badge.won .bic{background:var(--lapis-soft);border-color:var(--lapis)}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px;color:var(--muted)}

/* ── Editor de capítulo ── */
.ed-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ch-title{font-family:var(--serif);font-size:20px;font-weight:600;background:transparent;border:0;padding:6px 2px;flex:1;min-width:0;border-radius:6px}
.ch-title:hover{background:var(--hover)}
.ed-tools{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  background:var(--ink);padding:7px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.ed-tools .tb{min-width:34px;height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--muted)}
.ed-tools .tb:hover{background:var(--hover);color:var(--text)}
.ed-tools .tb.on{background:var(--lapis-soft);color:var(--lapis);border-color:var(--lapis)}
.ed-tools .tb.bld{font-weight:800}.ed-tools .tb.itl{font-style:italic}.ed-tools .tb.und{text-decoration:underline}
.ed-tools select{width:auto;padding:6px 8px;font-size:13px}
.ed-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#findBar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:12px}
#findBar input[type=text]{flex:1;min-width:120px}
#findBar label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);white-space:nowrap}
#ed{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 22px 40vh;
  min-height:55vh;font-family:var(--serif);font-size:var(--fs-ed);line-height:1.75;caret-color:var(--lapis)}
#ed:focus{outline:none;border-color:var(--lapis)}
#ed p,#ed div{margin:0 0 .5em}
#ed.sp-compacto p,#ed.sp-compacto div{margin:0}
#ed.sp-amplio p,#ed.sp-amplio div{margin:0 0 1.1em}
#ed.ind p,#ed.ind div{text-indent:1.5em}
#ed p[data-ind="1"],#ed div[data-ind="1"]{text-indent:1.5em!important}
#ed p[data-ind="0"],#ed div[data-ind="0"]{text-indent:0!important}
#ed h3{font-size:1.25em;margin:1.2em 0 .6em;text-indent:0!important;text-align:center;letter-spacing:.04em}
.ed-tools .tb svg{display:block;margin:auto;pointer-events:none}

/* ── Lector ── */
.ovl{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;padding:26px 18px 80px}
.ovl .inner{max-width:640px;margin:0 auto;font-family:var(--serif);font-size:calc(var(--fs-ed) + 1px);line-height:1.85}
.ovl .inner h1{font-size:26px;text-align:center;margin:20px 0 30px}
.ovl .inner p,.ovl .inner div{margin:0 0 .5em}
.ovl.ind .inner p,.ovl.ind .inner div{text-indent:1.5em}
.ovl .inner p[data-ind="1"],.ovl .inner div[data-ind="1"]{text-indent:1.5em!important}
.ovl .inner p[data-ind="0"],.ovl .inner div[data-ind="0"]{text-indent:0!important}
.ovl-close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:81}
body.focusmode #topbar,body.focusmode #nav{display:none}

/* ── Panel lateral (drawer) ── */
#backdrop{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.5)}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:65;width:min(400px,94vw);background:var(--surface);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);box-shadow:-12px 0 40px rgba(0,0,0,.4)}
#drawer .dtabs{display:flex;border-bottom:1px solid var(--line)}
#drawer .dtabs button{flex:1;padding:13px 6px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
#drawer .dtabs button.on{color:var(--lapis);border-bottom-color:var(--lapis);font-weight:600}
#drawerBody{flex:1;overflow-y:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.scene{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 11px;margin-bottom:8px}
.scene .sh{display:flex;align-items:center;gap:6px}
.scene .sh b{flex:1;font-size:14px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene .mini{width:28px;height:28px;border-radius:7px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.scene .mini:hover{background:var(--hover);color:var(--text)}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.vrow span{flex:1;color:var(--muted)}

/* ── Ajustes ── */
.themecard{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;background:var(--panel)}
.themecard.on{border-color:var(--lapis)}
.themecard .sw{display:flex;gap:4px;margin-bottom:8px}
.themecard .sw i{width:20px;height:20px;border-radius:6px;border:1px solid rgba(128,128,128,.35)}
.themecard b{font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:7px 16px;font-size:13.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--lapis-soft);color:var(--lapis);font-weight:600}
.trow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tinfo{flex:1;min-width:0}

  if(state.meta.accent){st.setProperty('--lapis',state.meta.accent);st.setProperty('--lapis-soft',state.meta.accent+'29')}
  st.setProperty('--fs-ed',{s:'16px',m:'18.5px',l:'21px'}[state.meta.fontScale||'m']);
  st.setProperty('color-scheme',t.dark?'dark':'light');
  let m=document.querySelector('meta[name=theme-color]');
  if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}
  m.content=t.v.ink;
  applyBg();
  let ic=document.querySelector('link[rel=icon]');
  if(!ic){ic=document.createElement('link');ic.rel='icon';document.head.appendChild(ic)}
  ic.href=LOGO_DATA;
}

/* El velo del tema se funde con la imagen en un solo lienzo opaco:
   una capa translúcida a pantalla completa atasca el compositor de Chrome. */
let bgCache={key:null,url:null};
function applyBg(){
  const bg=document.getElementById('bgLayer');if(!bg)return;
  const src=state.meta.bgImage==='builtin'?BG_DATA:state.meta.bgImage;
  if(!src){bg.style.backgroundImage='';bgCache={key:null,url:null};return}
  const ink=(THEMES[state.meta.themeId]||THEMES.oro).v.ink;
  const veil=state.meta.bgVeil??0.9;
  const key=src.length+'|'+ink+'|'+veil;
  if(bgCache.key===key){bg.style.backgroundImage=`url(${bgCache.url})`;return}
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const x=c.getContext('2d');
    x.drawImage(img,0,0);
    x.globalAlpha=veil;x.fillStyle=ink;x.fillRect(0,0,c.width,c.height);
    bgCache={key,url:c.toDataURL('image/jpeg',0.8)};
    bg.style.backgroundImage=`url(${bgCache.url})`;
  };
  img.src=src;
}

/* ═══════════ Estado: defaults, migración, normalización ═══════════ */
function defMeta(){return{themeId:'oro',accent:null,fontScale:'m',wpm:200,bgImage:null,bgVeil:0.9,
  catColors:{characters:'#3F6FA6',places:'#3B7A57',groups:'#7A4E9C',easterEggs:'#A6761F'},
  charFields:[{id:'f_edad',label:'Edad'},{id:'f_nac',label:'Año de nacimiento'},{id:'f_gen',label:'Género'}],
  currentSaga:null,currentBook:null,lastBackup:null,created:Date.now()}}
function blank(){return{sagas:[],trash:[],meta:defMeta()}}
function newSaga(name){return{id:uid(),name,characters:[],places:[],groups:[],tags:[],
  timelines:[{id:uid(),name:'Cronología de '+name,hitos:[]}],languages:[],easterEggs:[],books:[]}}
function newBook(name){return{id:uid(),name,cover:null,goalWords:0,estado:'en_marcha',idea:'',sinopsis:'',acts:[],chapters:[],updated:Date.now()}}
function newChapter(){return{id:uid(),title:'Capítulo sin título',body:'',indent:true,spacing:'normal',image:null,
  links:[],tagIds:[],actId:null,status:'borrador',scenes:[],versions:[],updated:Date.now(),created:Date.now()}}

function migrate(d){
  if(!d||typeof d!=='object')return blank();
  if(Array.isArray(d.sagas))return d;
  if(Array.isArray(d.chapters)){
    const s=newSaga('Akharta'),b=newBook('Libro I');
    b.chapters=d.chapters;s.books=[b];
    return{sagas:[s],trash:[],meta:d.meta||defMeta()};
  }
  return blank();
}
function normalize(){
  if(!Array.isArray(state.sagas))state.sagas=[];
  if(!Array.isArray(state.trash))state.trash=[];
  state.meta=Object.assign(defMeta(),state.meta||{});
  if(state.meta.theme){state.meta.themeId=state.meta.theme==='light'?'pergamino':'oro';delete state.meta.theme}
  if(!THEMES[state.meta.themeId])state.meta.themeId='oro';
  state.meta.catColors=Object.assign(defMeta().catColors,state.meta.catColors||{});
  if(!Array.isArray(state.meta.charFields)||!state.meta.charFields.length)state.meta.charFields=defMeta().charFields;
  if(typeof state.meta.bgVeil!=='number')state.meta.bgVeil=0.9;
  if(state.meta.bgImage!=='builtin'&&typeof state.meta.bgImage!=='string')state.meta.bgImage=state.meta.bgImage||null;
  state.meta.views=Object.assign(DEF_VIEWS(),state.meta.views||{});
  for(const s of state.sagas){
    s.id=s.id||uid();s.name=s.name||'Saga sin nombre';
    for(const k of['characters','places','groups','tags','languages','easterEggs','books'])if(!Array.isArray(s[k]))s[k]=[];
    if(s.timeline&&!s.timelines)s.timelines=[s.timeline],delete s.timeline;
    if(!Array.isArray(s.timelines))s.timelines=[];
    if(!s.timelines.length)s.timelines.push({id:uid(),name:'Cronología de '+s.name,hitos:[]});
    for(const t of s.timelines){t.id=t.id||uid();t.name=t.name||'Cronología';if(!Array.isArray(t.hitos))t.hitos=[];
      for(const h of t.hitos)Object.assign(h,{id:h.id||uid(),kind:HKINDS[h.kind]?h.kind:'mes',title:h.title||'Hito',anchor:h.anchor||'',order:h.order??10,body:h.body||'',chapterIds:Array.isArray(h.chapterIds)?h.chapterIds:[]})}
    for(const c of s.characters)Object.assign(c,{id:c.id||uid(),name:c.name||'Sin nombre',role:c.role||'',body:c.body||'',image:c.image||null,rels:Array.isArray(c.rels)?c.rels:[],fields:c.fields||{},relLabels:c.relLabels&&typeof c.relLabels==='object'?c.relLabels:{},placeRels:Array.isArray(c.placeRels)?c.placeRels:[],status:STATUS[c.status]?c.status:'borrador',updated:c.updated||0});
    for(const p of s.places)Object.assign(p,{id:p.id||uid(),name:p.name||'Nueva ubicación',body:p.body||'',parentId:p.parentId||null,status:STATUS[p.status]?p.status:'borrador',updated:p.updated||0});
    for(const g of s.groups)Object.assign(g,{id:g.id||uid(),name:g.name||'Nuevo grupo',body:g.body||'',members:Array.isArray(g.members)?g.members:[],chapterIds:Array.isArray(g.chapterIds)?g.chapterIds:[],status:STATUS[g.status]?g.status:'borrador',updated:g.updated||0});
    for(const t of s.tags)Object.assign(t,{id:t.id||uid(),name:t.name||'Etiqueta',color:t.color||TAGPAL[0]});
    for(const l of s.languages){Object.assign(l,{id:l.id||uid(),name:l.name||'Idioma',words:Array.isArray(l.words)?l.words:[]});
      for(const w of l.words)Object.assign(w,{id:w.id||uid(),term:w.term||'',meaning:w.meaning||'',type:w.type||'',notes:w.notes||''})}
    for(const e of s.easterEggs)Object.assign(e,{id:e.id||uid(),title:e.title||'Nuevo secreto',body:e.body||'',chapterIds:Array.isArray(e.chapterIds)?e.chapterIds:[],links:Array.isArray(e.links)?e.links:[],status:STATUS[e.status]?e.status:'borrador',updated:e.updated||0});
    for(const b of s.books){
      Object.assign(b,{id:b.id||uid(),name:b.name||'Libro',cover:b.cover||null,goalWords:b.goalWords||0,
        estado:ESTADOS[b.estado]?b.estado:'en_marcha',idea:b.idea||'',sinopsis:b.sinopsis||''});
      if(!Array.isArray(b.acts))b.acts=[];
      if(!Array.isArray(b.chapters))b.chapters=[];
      for(const a of b.acts)Object.assign(a,{id:a.id||uid(),name:a.name||'Nuevo acto',order:a.order??10,desc:a.desc||'',estado:STATUS[a.estado]?a.estado:'borrador'});
      for(const c of b.chapters)Object.assign(c,{id:c.id||uid(),title:c.title||'Capítulo sin título',body:c.body||'',
        indent:c.indent!==false,spacing:['compacto','normal','amplio'].includes(c.spacing)?c.spacing:'normal',
        image:c.image||null,links:Array.isArray(c.links)?c.links:[],tagIds:Array.isArray(c.tagIds)?c.tagIds:[],
        actId:c.actId||null,status:STATUS[c.status]?c.status:'borrador',sinopsis:c.sinopsis||'',
        scenes:Array.isArray(c.scenes)?c.scenes:[],versions:Array.isArray(c.versions)?c.versions:[],
        updated:c.updated||Date.now(),created:c.created||Date.now()});
      for(const c of b.chapters)for(const sc of c.scenes)Object.assign(sc,{id:sc.id||uid(),title:sc.title||'Escena',note:sc.note||'',from:Number.isInteger(sc.from)?sc.from:null,to:Number.isInteger(sc.to)?sc.to:null});
    }
  }
  const sagaIds=state.sagas.map(s=>s.id);
  if(state.meta.currentSaga&&!sagaIds.includes(state.meta.currentSaga))state.meta.currentSaga=null;
}

function pickImage(cb,max){

  f.click();

function resizeImg(file,max){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=max||820,sc=Math.min(1,MAX/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.72));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

const sagaById=id=>state.sagas.find(s=>s.id===id);
const curSaga=()=>sagaById(state.meta.currentSaga);

function findChap(saga,id){
  for(const b of saga.books){const c=b.chapters.find(c=>c.id===id);if(c)return{book:b,ch:c}}
  return null;
}
const chapWords=ch=>countWords(ch.body);
const bookWords=b=>b.chapters.reduce((n,c)=>n+chapWords(c),0);
const charById=(s,id)=>s.characters.find(c=>c.id===id);
const placeById=(s,id)=>s.places.find(p=>p.id===id);
function allHitosLinking(saga,chId){
  const out=[];
  for(const tl of saga.timelines)for(const h of tl.hitos)if(h.chapterIds.includes(chId))out.push({tl,h});
  return out;
}
function placeDescendants(saga,id){
  const out=new Set();
  const walk=pid=>{for(const p of saga.places)if(p.parentId===pid&&!out.has(p.id)){out.add(p.id);walk(p.id)}};
  walk(id);return out;
}

function toTrash(kind,label,ctx,data){
  state.trash.unshift({id:uid(),kind,label,ts:Date.now(),ctx,data});
  state.trash=state.trash.slice(0,25);
  scheduleSave();
}
const TRASH_KINDS={chapter:'Capítulo',character:'Personaje',place:'Ubicación',group:'Grupo',egg:'Easter egg',tag:'Etiqueta',language:'Idioma',timeline:'Cronología',hito:'Hito',word:'Palabra',act:'Acto'};
function restoreTrash(id){
  const i=state.trash.findIndex(t=>t.id===id);if(i<0)return;
  const t=state.trash[i],s=sagaById(t.ctx.sagaId);
  const fail=m=>toast('No se puede restaurar: '+m);
  if(!s)return fail('su saga ya no existe.');
  let target=null;
  switch(t.kind){
    case 'chapter':case 'act':{
      const b=s.books.find(b=>b.id===t.ctx.bookId);
      if(!b)return fail('su libro ya no existe.');
      target=t.kind==='chapter'?b.chapters:b.acts;break;
    }
    case 'character':target=s.characters;break;
    case 'place':target=s.places;
      if(t.data.parentId&&!placeById(s,t.data.parentId))t.data.parentId=null;break;
    case 'group':target=s.groups;break;
    case 'egg':target=s.easterEggs;break;
    case 'tag':target=s.tags;break;
    case 'language':target=s.languages;break;
    case 'timeline':target=s.timelines;break;
    case 'hito':{
      const tl=s.timelines.find(x=>x.id===t.ctx.tlId);
      if(!tl)return fail('su cronología ya no existe.');
      target=tl.hitos;break;
    }
    case 'word':{
      const l=s.languages.find(x=>x.id===t.ctx.langId);
      if(!l)return fail('su idioma ya no existe.');
      target=l.words;break;
    }
    default:return fail('tipo desconocido.');
  }
  target.push(t.data);
  state.trash.splice(i,1);
  scheduleSave();toast(`${TRASH_KINDS[t.kind]} restaurado`);render();
}

/* Versiones */
function snapshot(ch,force){
  const last=ch.versions[ch.versions.length-1];
  if(force||!last||last.body!==ch.body){
    if(!force&&!ch.body&&!last)return;
    ch.versions.push({ts:Date.now(),body:ch.body});
    while(ch.versions.length>8)ch.versions.shift();
    scheduleSave();
    return true;
  }
  return false;
}

/* ═══════════ Recorte de imagen (avatares, portadas, imágenes de capítulo) ═══════════ */
let cropS=null;
function roundHole(x,w,h,r){
  x.moveTo(2+r,2);x.arcTo(w-2,2,w-2,h-2,r);x.arcTo(w-2,h-2,2,h-2,r);
  x.arcTo(2,h-2,2,2,r);x.arcTo(2,2,w-2,2,r);x.closePath();
}
function cropDraw(){
  const s=cropS,c=document.getElementById('ccanvas'),x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  const iw=s.img.width*s.st,ih=s.img.height*s.st;
  x.drawImage(s.img,c.width/2-iw/2+s.ox,c.height/2-ih/2+s.oy,iw,ih);
  x.fillStyle='rgba(0,0,0,.5)';
  x.beginPath();x.rect(0,0,c.width,c.height);
  if(s.shape==='circle'){x.arc(c.width/2,c.height/2,Math.min(c.width,c.height)/2-2,0,Math.PI*2,true)}
  else{roundHole(x,c.width,c.height,10)}
  x.fill('evenodd');
}
function cropClamp(){
  const s=cropS,c=document.getElementById('ccanvas'),w=s.img.width*s.st,h=s.img.height*s.st;
  s.ox=Math.max(-(w-c.width)/2,Math.min((w-c.width)/2,s.ox));
  s.oy=Math.max(-(h-c.height)/2,Math.min((h-c.height)/2,s.oy));
}
function cropImage(src,opts){
  opts=opts||{};
  const aspect=opts.aspect||1,shape=opts.shape||(aspect===1?'circle':'rect');
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let fw,fh;if(aspect>=1){fw=300;fh=Math.round(300/aspect)}else{fh=300;fw=Math.round(300*aspect)}
      const c=document.getElementById('ccanvas');c.width=fw;c.height=fh;
      const base=Math.max(fw/img.width,fh/img.height);
      cropS={img,base,st:base,ox:0,oy:0,res,shape};
      document.getElementById('czoom').value=100;
      document.getElementById('crop').hidden=false;
      cropDraw();
    };
    img.onerror=()=>res(null);
    img.src=src;
  });
}
function cropInit(){
  const cv=document.getElementById('ccanvas');
  let drag=null;
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{
    if(!drag||!cropS)return;
    const kx=cv.width/(cv.clientWidth||cv.width),ky=cv.height/(cv.clientHeight||cv.height);
    cropS.ox+=(e.clientX-drag.x)*kx;cropS.oy+=(e.clientY-drag.y)*ky;
    drag={x:e.clientX,y:e.clientY};cropClamp();cropDraw();
  });
  cv.addEventListener('pointerup',()=>drag=null);
  document.getElementById('czoom').addEventListener('input',e=>{
    if(!cropS)return;
    cropS.st=cropS.base*(e.target.value/100);cropClamp();cropDraw();
  });
  document.getElementById('cCancel').onclick=()=>{
    document.getElementById('crop').hidden=true;
    const r=cropS.res;cropS=null;r(null);
  };
  document.getElementById('cOk').onclick=()=>{
    const s=cropS,c=document.getElementById('ccanvas');
    const k=720/Math.max(c.width,c.height);
    const ow=Math.round(c.width*k),oh=Math.round(c.height*k);
    const cv2=document.createElement('canvas');cv2.width=ow;cv2.height=oh;
    const iw=s.img.width*s.st,ih=s.img.height*s.st;
    cv2.getContext('2d').drawImage(s.img,(c.width/2-iw/2+s.ox)*k,(c.height/2-ih/2+s.oy)*k,iw*k,ih*k);
    document.getElementById('crop').hidden=true;
    const r=s.res;cropS=null;r(cv2.toDataURL('image/jpeg',0.82));
  };
}

/* ═══════════ Textareas que crecen con el texto (máx. 70vh, luego scroll) ═══════════ */
function autoGrow(t){t.style.height='auto';const max=Math.round(innerHeight*0.7);t.style.height=Math.min(t.scrollHeight+2,max)+'px'}
function growAll(root){(root||document).querySelectorAll('textarea').forEach(autoGrow)}
document.addEventListener('input',e=>{if(e.target&&e.target.tagName==='TEXTAREA')autoGrow(e.target)});

/* ═══════════ Reordenar arrastrando ═══════════ */
function makeDrag(list,onDone){
  if(!list)return;
  for(const h of list.querySelectorAll('.dhandle')){
    h.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const item=h.closest('[data-did]');if(!item)return;
      let moved=false;
      item.classList.add('dragging');
      const move=ev=>{
        moved=true;
        const others=[...list.querySelectorAll('[data-did]')].filter(x=>x!==item);
        let ref=null;
        for(const x of others){const r=x.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){ref=x;break}}
        if(ref)list.insertBefore(item,ref);else list.appendChild(item);
      };
      const up=()=>{
        item.classList.remove('dragging');
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        if(moved){
          list.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault()},{capture:true,once:true});
          onDone([...list.querySelectorAll('[data-did]')].map(x=>x.dataset.did));
        }
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
    });
  }
}

<script>
'use strict';
/* ═══════════ Render maestro ═══════════ */
const view=()=>$('#view');
function rTop(){return route[route.length-1]}
function render(){
  const r=rTop();

  if(typeof revClear==='function')revClear();
  {const sx=document.getElementById('scExit');if(sx)sx.remove()}
  const ae=document.activeElement;
  if(ae&&ae!==document.body&&view().contains(ae))ae.blur(); /* evita desmontar el editor con la selección viva */
  try{const sel=getSelection();if(sel&&sel.rangeCount&&view().contains(sel.anchorNode))sel.removeAllRanges()}catch(e){}
  updateTopbar(r);renderNav(r);
  const v=view();v.scrollTop=0;
  switch(r.v){
    case 'lib':renderLib();break;
    case 'book':renderBook(r);break;
    case 'settings':renderSettings();break;
    case 'chap':renderChap(r);break;
    case 'tl':renderTl(r);break;
    case 'lang':renderLang(r);break;
    case 'ent':renderEnt(r);break;
    default:route=[{v:'lib'}];renderLib();
  }
  growAll(v);
}
function updateTopbar(r){
  $('#btnBack').hidden=route.length<2;
  const t=$('#topTitle');t.classList.remove('editable');t.onclick=null;
  let title='Biblioteca';
  if(r.v==='book'){const b=curBook();title=b?b.name:'Libro';
    t.classList.add('editable');t.onclick=renameCurBook;}
  else if(r.v==='settings')title='Ajustes';
  else if(r.v==='chap'){const s=curSaga(),f=s&&findChap(s,r.id);title=f?f.book.name:'Capítulo'}
  else if(r.v==='tl'){const s=curSaga(),tl=s&&s.timelines.find(x=>x.id===r.id);title=tl?tl.name:'Cronología'}
  else if(r.v==='lang'){const s=curSaga(),l=s&&s.languages.find(x=>x.id===r.id);title=l?l.name:'Idioma'}
  else if(r.v==='ent')title={character:'Personaje',place:'Ubicación',group:'Grupo',hito:'Hito',egg:'Easter egg',word:'Palabra',act:'Acto'}[r.kind]||'Ficha';

}
async function renameCurBook(){
  const b=curBook();if(!b)return;
  const n=await askText('Renombrar libro',b.name);
  if(n){b.name=n;b.updated=Date.now();scheduleSave();render()}
}
const TABS=[['resumen','◈','Resumen'],['caps','✦','Capítulos'],['mundo','☾','Mundo'],['actos','▦','Escaleta'],['logros','★','Logros']];

/* ── Controles compartidos de vista, orden y filtro ── */
function setView(sec,k,val){state.meta.views[sec][k]=val;scheduleSave();render()}
function viewCtl(sec,modes){
  const v=state.meta.views[sec];
  const icons={tree:['⚯','Árbol'],grid:['▦','Mosaico'],list:['☰','Lista']};
  return `<span class="row" style="gap:4px">
    ${modes.map(m=>`<button class="iconb ${v.mode===m?'on':''}" title="${icons[m][1]}" onclick="setView('${sec}','mode','${m}')">${icons[m][0]}</button>`).join('')}
    ${v.mode==='grid'?`<select title="Tamaño de miniaturas" onchange="setView('${sec}','size',this.value)">
      ${[['s','Peq.'],['m','Med.'],['l','Gran.']].map(([k,l])=>`<option value="${k}" ${v.size===k?'selected':''}>${l}</option>`).join('')}</select>`:''}
  </span>`;
}
function gridStyle(sec){
  const px=(sec==='chapters'?{s:230,m:245,l:370}:{s:130,m:175,l:240})[state.meta.views[sec].size||'m'];
  return `grid-template-columns:repeat(auto-fill,minmax(${px}px,1fr))`;
}
function sortSel(cur,fn,extra=''){
  const opts=[['','Orden manual'],['az','A → Z'],['za','Z → A'],['recent','Más recientes']].concat(extra?[[
    'words','Más palabras']]:[]);
  return `<select title="Ordenar" onchange="${fn}(this.value)">${opts.map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('')}</select>`;
}
function applySort(list,mode,name,upd){
  const key=x=>(name(x)||'').toLowerCase();
  const u=upd||(x=>x.updated||0);
  if(mode==='az')list.sort((a,b)=>key(a).localeCompare(key(b),'es'));
  else if(mode==='za')list.sort((a,b)=>key(b).localeCompare(key(a),'es'));
  else if(mode==='recent')list.sort((a,b)=>u(b)-u(a));
  return list;
}
function estadoFilterSel(cur,fn){
  return `<select title="Filtrar por estado" onchange="${fn}(this.value)">
    <option value="">Estado: todos</option>
    ${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('')}</select>`;
}
function setF(k,v){rTop()[k]=v||'';render()}
function legHtml(rows){
  const out=rows.filter(([,v])=>v&&v.length).map(([k,v])=>`<div><b>${k}:</b> ${esc(v.join(', '))}</div>`).join('');
  return out?`<div class="leg">${out}</div>`:'<div class="leg">Sin vínculos aún</div>';
}
function renderNav(r){

    TABS.map(([id,ic,lb])=>`<button class="navtab ${r.tab===id?'on':''}" onclick="setTab('${id}')"><span class="ic">${ic}</span><span>${lb}</span></button>`).join('');
}
function setTab(tab){const r=rTop();r.tab=tab;render()}

/* ═══════════ Biblioteca ═══════════ */
function renderLib(){
  const sagas=state.sagas.map(s=>{
    const w=s.books.reduce((n,b)=>n+bookWords(b),0);
    const books=s.books.map(b=>{
      const bw=bookWords(b);
      return `<button class="bookcard" onclick="openBook('${s.id}','${b.id}')">
        <div class="cov">${b.cover?`<img src="${b.cover}" alt="">`:esc((b.name||'L')[0])}</div>
        <div class="bi"><b>${esc(b.name)}</b>
        <span class="estado ${b.estado}">${ESTADOS[b.estado]}</span>
        <div class="small muted num" style="margin-top:5px">${b.chapters.length} cap. · ${fmtN(bw)} palabras</div></div>

    }).join('');

        <div class="row">
          <button class="btn btn-s" onclick="addBook('${s.id}')">＋ Libro</button>
          <button class="btn btn-s btn-d" onclick="delSaga('${s.id}')">Eliminar</button>
        </div>

    <div class="row" style="justify-content:center;margin-bottom:22px"><button class="btn btn-p" onclick="addSaga()">＋ Saga</button></div>
    ${sagas||'<p class="muted" style="text-align:center">Crea tu primera saga para empezar a escribir.</p>'}
  </div>`;
}
async function addSaga(){const n=await askText('Nueva saga','Akharta');if(n){state.sagas.push(newSaga(n));scheduleSave();render()}}
async function renameSaga(id){const s=sagaById(id);const n=await askText('Renombrar saga',s.name);if(n){s.name=n;scheduleSave();render()}}
async function delSaga(id){
  const s=sagaById(id);
  if(!await askConfirm2(`Eliminar la saga «${s.name}» con todos sus libros, personajes y mundo. Las sagas NO van a la papelera.`))return;
  state.sagas=state.sagas.filter(x=>x.id!==id);
  if(state.meta.currentSaga===id){state.meta.currentSaga=null;state.meta.currentBook=null}
  scheduleSave();toast('Saga eliminada');render();
}
async function addBook(sagaId){
  const s=sagaById(sagaId);
  const n=await askText('Nuevo libro',`Libro ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][s.books.length]||s.books.length+1}`);
  if(n){s.books.push(newBook(n));scheduleSave();render()}
}
function openBook(sagaId,bookId){
  state.meta.currentSaga=sagaId;state.meta.currentBook=bookId;
  const b=curBook();ensureSession(b);scheduleSave();
  go({v:'book',tab:'resumen'});
}

/* ═══════════ Libro: pestañas ═══════════ */
function renderBook(r){
  const s=curSaga(),b=curBook();
  if(!s||!b){route=[{v:'lib'}];render();return}
  ensureSession(b);
  ({resumen:renderResumen,caps:renderCaps,mundo:renderMundo,actos:renderActos,logros:renderLogros}[r.tab]||renderResumen)(r,s,b);
}

/* ── Resumen ── */
function renderResumen(r,s,b){
  const w=bookWords(b),delta=sessDelta(b);
  const scenes=b.chapters.reduce((n,c)=>n+c.scenes.length,0);
  const mins=b.chapters.reduce((n,c)=>n+readMins(chapWords(c)),0);
  const hitos=s.timelines.reduce((n,t)=>n+t.hitos.length,0);
  const terms=s.languages.reduce((n,l)=>n+l.words.length,0);
  const stats=[[b.chapters.length,'Capítulos'],[scenes,'Escenas'],[fmtN(w),'Palabras'],['≈ '+fmtN(bookPages(b)),'Páginas A5'],[fmtMins(mins),'Lectura'],
    [s.characters.length,'Personajes'],[s.places.length,'Ubicaciones'],[s.groups.length,'Grupos'],
    [hitos,'Hitos'],[s.easterEggs.length,'Easter eggs'],[terms,'Términos']];
  const prog=b.goalWords>0?Math.min(100,Math.round(w/b.goalWords*100)):0;
  view().innerHTML=`<div class="wrap watermark">${logoSVG('wm')}
    <div class="hero">
      <div class="cov">${b.cover?`<img src="${b.cover}" alt="">`:esc((b.name||'L')[0])}</div>
      <div style="flex:1;min-width:0">
        <div class="small muted">${esc(s.name)}</div>
        <h2>${esc(b.name)}</h2>
        <div class="small muted">Última edición: ${fmtDate(b.updated)}</div>
        <div class="small num" style="margin:6px 0 10px;color:${delta>0?'var(--ok)':'var(--muted)'}">${delta>=0?'+':''}${fmtN(delta)} palabras esta sesión</div>
        <select style="width:auto" onchange="setBookEstado(this.value)">
          ${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${b.estado===k?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="sect stack">
      <div class="field"><label class="lbl" for="fIdea">Idea (una frase)</label>
        <input id="fIdea" value="${esc(b.idea)}" placeholder="La chispa del libro…" oninput="updBook('idea',this.value)"></div>
      <div class="field"><label class="lbl" for="fSin">Sinopsis</label>
        <textarea id="fSin" placeholder="De qué va la historia…" oninput="updBook('sinopsis',this.value)">${esc(b.sinopsis)}</textarea></div>
    </div>
    <div class="sect"><h2>Estadísticas</h2>
      <div class="statgrid">${stats.map(([n,l])=>`<div class="stat"><b class="num">${n}</b><span>${l}</span></div>`).join('')}</div>
    </div>
    ${b.goalWords>0?`<div class="sect"><h2>Progreso</h2><div class="card">
      <div class="spread small num" style="margin-bottom:8px"><span>${fmtN(w)} / ${fmtN(b.goalWords)} palabras</span><b>${prog}%</b></div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      <div class="small muted num" style="margin-top:8px">${w>=b.goalWords?'¡Objetivo alcanzado!':`Faltan ${fmtN(b.goalWords-w)} palabras`}</div>
    </div></div>`:''}
    <div class="sect"><h2>Exportar este libro</h2><div class="card row">
      <button class="btn" onclick="expDoc(curBook())">Word (.doc)</button>
      <button class="btn" onclick="expPdf(curBook())">PDF (imprimir)</button>
      <button class="btn" onclick="expTxt(curBook(),$('#ckNB').checked)">Texto (.txt)</button>
      <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ckNB">sin líneas en blanco</label>
    </div></div>
    <div class="sect"><h2>Ajustes del libro</h2><div class="card row">
      <button class="btn" onclick="pickCover()">${b.cover?'Cambiar portada':'Añadir portada'}</button>
      ${b.cover?'<button class="btn" onclick="rmCover()">Quitar portada</button>':''}
      <button class="btn" onclick="renameCurBook()">Renombrar</button>
      <button class="btn btn-d" onclick="delCurBook()">Eliminar libro</button>
    </div></div>
  </div>`;
}
function updBook(k,v){const b=curBook();b[k]=v;b.updated=Date.now();scheduleSave()}
function setBookEstado(v){updBook('estado',v)}
function pickCover(){pickImage(async url=>{const out=await cropImage(url,{aspect:2/2.6,shape:'rect'});if(out){updBook('cover',out);render()}})}
function rmCover(){updBook('cover',null);render()}
async function delCurBook(){
  const s=curSaga(),b=curBook();
  if(!await askConfirm2(`Eliminar el libro «${b.name}» con sus ${b.chapters.length} capítulos. Los libros NO van a la papelera.`))return;
  s.books=s.books.filter(x=>x.id!==b.id);state.meta.currentBook=null;
  scheduleSave();toast('Libro eliminado');route=[{v:'lib'}];render();

/* ── Capítulos ── */
function renderCaps(r,s,b){
  const acts=[...b.acts].sort((x,y)=>x.order-y.order);
  view().innerHTML=`<div class="wrap">
    <div class="searchrow">
      <input type="search" id="capQ" placeholder="Buscar por título, sinopsis o texto…" value="${esc(r.q||'')}" oninput="capSearch(this.value)">
      <button class="iconb ${r.reorder?'on':''}" title="Reordenar" onclick="toggleReorder()">⇅</button>
      <button class="btn btn-p" onclick="addChapter()">＋ Capítulo</button>
    </div>
    <div class="ctlrow">
      ${sortSel(r.sort||'','capSort','words')}
      ${estadoFilterSel(r.fEst||'','capFEst')}
      ${acts.length?`<select title="Filtrar por acto" onchange="capFAct(this.value)">
        <option value="">Acto: todos</option>
        <option value="none" ${r.fAct==='none'?'selected':''}>Sin acto</option>
        ${acts.map(a=>`<option value="${a.id}" ${r.fAct===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}
      ${s.tags.length?`<select title="Filtrar por etiqueta" onchange="capFTag(this.value)">
        <option value="">Etiqueta: todas</option>
        ${s.tags.map(t=>`<option value="${t.id}" ${r.fTag===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}
      ${viewCtl('chapters',['grid','list'])}
    </div>
    <div id="capList"></div>
  </div>`;
  fillCaps();
}
function capSort(v){rTop().sort=v;fillCaps()}
function capFEst(v){rTop().fEst=v;fillCaps()}
function capFAct(v){rTop().fAct=v;fillCaps()}
function capFTag(v){rTop().fTag=v;fillCaps()}
function capSearch(q){rTop().q=q;fillCaps()}
function toggleReorder(){const r=rTop();r.reorder=!r.reorder;render()}
function fillCaps(){
  const r=rTop(),s=curSaga(),b=curBook(),q=(r.q||'').toLowerCase();
  let list=b.chapters.map((c,i)=>({c,i}));
  if(q)list=list.filter(({c})=>c.title.toLowerCase().includes(q)||(c.sinopsis||'').toLowerCase().includes(q)||plain(c.body).toLowerCase().includes(q));
  if(r.fEst)list=list.filter(({c})=>c.status===r.fEst);
  if(r.fAct)list=list.filter(({c})=>r.fAct==='none'?!c.actId:c.actId===r.fAct);
  if(r.fTag)list=list.filter(({c})=>c.tagIds.includes(r.fTag));
  if(r.sort==='words')list.sort((a,b)=>chapWords(b.c)-chapWords(a.c));
  else if(r.sort)applySort(list,r.sort,x=>x.c.title,x=>x.c.updated||0);
  const el=$('#capList');
  if(!b.chapters.length){el.innerHTML='<p class="muted" style="text-align:center;padding:40px 0">Aún no hay capítulos. La historia empieza con «＋ Capítulo».</p>';return}
  if(r.reorder){
    el.innerHTML=`<p class="muted small" style="margin-bottom:10px">Arrastra ≡ para reordenar (o usa las flechas).</p><div id="capRe">`+
      b.chapters.map((c,i)=>`<div class="reorder-row" data-did="${c.id}" style="margin-bottom:8px">
      <span class="dhandle">≡</span><span class="muted small num">${i+1}</span><b>${esc(c.title)}</b>
      <button class="iconb" ${i===0?'disabled':''} onclick="mvChap(${i},-1)">↑</button>
      <button class="iconb" ${i===b.chapters.length-1?'disabled':''} onclick="mvChap(${i},1)">↓</button>
    </div>`).join('')+`</div>`;
    makeDrag($('#capRe'),ids=>{
      const bb=curBook();
      bb.chapters=ids.map(id=>bb.chapters.find(c=>c.id===id)).filter(Boolean);
      scheduleSave();fillCaps();
    });
    return;
  }
  if(state.meta.views.chapters.mode==='list'){
    el.innerHTML=list.map(({c,i})=>{
      const w=chapWords(c);
      return `<button class="lrow" style="--stc:${STCLR(c.status)}" onclick="openChap('${c.id}')">
        ${c.image?`<img class="thumb" src="${c.image}" alt="">`:''}
        <div class="li"><b>Nº ${i+1} · ${esc(c.title)}</b>
        <div class="desc-1">${esc(c.sinopsis||plain(c.body).trim().slice(0,110))||'Sin texto todavía'}</div></div>
        <span class="small muted num" style="flex:none">${fmtN(w)} pal. · ≈${chapPages(c)} pág.</span>

const MUNDO=[['characters','Personajes'],['places','Ubicaciones'],['groups','Grupos'],['timelines','Cronologías'],['languages','Idiomas'],['easterEggs','Easter eggs'],['tags','Etiquetas']];
const openPlaces=new Set();
function renderMundo(r,s,b){
  r.sub=r.sub||'characters';
  view().innerHTML=`<div class="wrap">
    <div class="subchips">${MUNDO.map(([id,lb])=>`<button class="sc ${r.sub===id?'on':''}" onclick="setSub('${id}')">${lb}</button>`).join('')}</div>
    <div id="mundoBody"></div>
  </div>`;
  fillMundo();
  /* deslizar a los lados para cambiar de característica */
  const mb=$('#mundoBody');
  let _sx=null,_sy=null;
  mb.addEventListener('touchstart',e=>{_sx=e.touches[0].clientX;_sy=e.touches[0].clientY},{passive:true});
  mb.addEventListener('touchend',e=>{
    if(_sx===null)return;
    const dx=e.changedTouches[0].clientX-_sx,dy=e.changedTouches[0].clientY-_sy;
    _sx=null;
    if(Math.abs(dx)<70||Math.abs(dy)>60)return;
    const ids=MUNDO.map(m=>m[0]);
    const i=ids.indexOf(rTop().sub||'characters')+(dx<0?1:-1);
    if(i>=0&&i<ids.length)setSub(ids[i]);
  },{passive:true});
}

async function delTag(id){
  const s=curSaga(),t=s.tags.find(t=>t.id===id);
  if(!await askConfirm(`Eliminar la etiqueta «${t.name}». Se quitará de todos los capítulos.`))return;
  for(const b of s.books)for(const c of b.chapters)c.tagIds=c.tagIds.filter(x=>x!==id);
  toTrash('tag',t.name,{sagaId:s.id},t);
  s.tags=s.tags.filter(x=>x.id!==id);

async function delTl(id){
  const s=curSaga();
  if(s.timelines.length<2){toast('No se puede eliminar la única cronología');return}
  const t=s.timelines.find(t=>t.id===id);
  if(!await askConfirm(`Eliminar la cronología «${t.name}» con sus ${t.hitos.length} hitos.`))return;
  toTrash('timeline',t.name,{sagaId:s.id},t);
  s.timelines=s.timelines.filter(x=>x.id!==id);
  scheduleSave();toast('Cronología eliminada (papelera)');render();

/* ── Cronología: detalle ── */
function renderTl(r){
  const s=curSaga(),tl=s.timelines.find(t=>t.id===r.id);
  if(!tl){goBack();return}
  const hitos=[...tl.hitos].sort((a,b)=>a.order-b.order);
  view().innerHTML=`<div class="wrap-n">
    <div class="spread" style="margin-bottom:16px"><h2>${esc(tl.name)}</h2>
      <button class="btn btn-p btn-s" onclick="addHito('${tl.id}')">＋ Hito</button></div>
    <p class="muted small" style="margin-bottom:10px" ${hitos.length<2?'hidden':''}>Arrastra ≡ para reordenar los hitos.</p>
    <div class="tl-axis" id="tlList">${hitos.map(h=>{
      const chips=h.chapterIds.map(id=>{const f=findChap(s,id);return f?`<span class="chip click" onclick="event.stopPropagation();openChapAny('${id}')">${esc(f.ch.title)}</span>`:''}).join('');
      const[kl,kc]=HKINDS[h.kind]||HKINDS.mes;
      return `<div class="hito h-${h.kind}" data-did="${h.id}" style="--kc:${kc}" onclick="openEnt('hito','${h.id}','${tl.id}')">
        <span class="dhandle" onclick="event.stopPropagation()">≡</span>
        <span class="node" style="background:${kc}"></span>
        ${h.kind==='anio'
          ?`<b>${esc(h.title)}</b>${h.anchor?`<div class="anchor">${esc(h.anchor)}</div>`:''}`
          :`<div class="anchor">${esc(h.anchor)||'Sin ancla temporal'}<span class="kchip">${kl}</span></div>
        <b>${esc(h.title)}</b>`}
        ${h.body?`<div class="small muted">${esc(h.body.slice(0,160))}</div>`:''}
        ${chips?`<div class="chips" style="margin-top:8px">${chips}</div>`:''}
      </div>`}).join('')||'<p class="muted">Sin hitos. Añade el primero para trazar el eje temporal.</p>'}</div>
  </div>`;
  makeDrag($('#tlList'),ids=>{
    const t=curSaga().timelines.find(x=>x.id===r.id);
    ids.forEach((id,i)=>{const h=t.hitos.find(h=>h.id===id);if(h)h.order=(i+1)*10});
    scheduleSave();render();
  });
}
function addHito(tlId){
  const tl=curSaga().timelines.find(t=>t.id===tlId);
  const maxO=tl.hitos.reduce((m,h)=>Math.max(m,h.order),0);
  const h={id:uid(),kind:'mes',title:'Nuevo hito',anchor:'',order:maxO+10,body:'',chapterIds:[]};
  tl.hitos.push(h);scheduleSave();openEnt('hito',h.id,tlId);
}

/* ── Idioma: detalle ── */
function renderLang(r){
  const s=curSaga(),l=s.languages.find(x=>x.id===r.id);
  if(!l){goBack();return}
  const q=(r.q||'').toLowerCase();
  const words=[...l.words].sort((a,b)=>a.term.localeCompare(b.term,'es')).filter(w=>!q||w.term.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q));
  view().innerHTML=`<div class="wrap-n">
    <div class="spread" style="margin-bottom:12px"><h2>${esc(l.name)} <span class="muted small num">${l.words.length} términos</span></h2>
      <div class="row"><button class="btn btn-s" onclick="renameLang('${l.id}')">Renombrar</button>
      <button class="btn btn-s btn-d" onclick="delLang('${l.id}')">Eliminar</button>
      <button class="btn btn-p btn-s" onclick="addWord('${l.id}')">＋ Palabra</button></div></div>
    <div class="searchrow"><input type="search" placeholder="Buscar término…" value="${esc(r.q||'')}" oninput="langSearch(this.value)"></div>
    <div class="card" style="padding:6px 14px">${words.map(w=>`<div class="trow" style="cursor:pointer" onclick="openEnt('word','${w.id}','${l.id}')">
      <div class="tinfo"><b style="font-family:var(--serif);font-style:italic">${esc(w.term)||'—'}</b>
      <span>${esc(w.meaning)}${w.type?` · ${esc(w.type)}`:''}</span></div>
    </div>`).join('')||'<p class="muted small" style="padding:10px 0">Sin términos todavía.</p>'}</div>
  </div>`;
}
async function renameLang(id){const l=curSaga().languages.find(x=>x.id===id);const n=await askText('Renombrar idioma',l.name);if(n){l.name=n;scheduleSave();render()}}
async function delLang(id){
  const s=curSaga(),l=s.languages.find(x=>x.id===id);
  if(!await askConfirm(`Eliminar el idioma «${l.name}» con sus ${l.words.length} términos.`))return;
  toTrash('language',l.name,{sagaId:s.id},l);
  s.languages=s.languages.filter(x=>x.id!==id);
  scheduleSave();toast('Idioma eliminado (papelera)');goBack();
}
function addWord(langId){
  const l=curSaga().languages.find(x=>x.id===langId);
  const w={id:uid(),term:'',meaning:'',type:'',notes:''};
  l.words.push(w);scheduleSave();openEnt('word',w.id,langId);
}

/* ── Actos ── */
function renderActos(r,s,b){
  const acts=[...b.acts].sort((x,y)=>x.order-y.order);
  const actSel=(c)=>`<select style="width:auto;font-size:12.5px;padding:5px 7px" onchange="setChapAct('${c.id}',this.value)">
    <option value="">Sin acto</option>
    ${acts.map(a=>`<option value="${a.id}" ${c.actId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`;
  const chapRow=c=>`<div class="trow acrow">
      ${c.image?`<img src="${c.image}" alt="">`:''}
      <div class="tinfo">
      <b style="cursor:pointer;font-family:var(--serif)" onclick="openChap('${c.id}')">${esc(c.title)}</b>
      ${c.sinopsis?`<span class="acsin">${esc(c.sinopsis)}</span>`:''}
      <span class="num">${fmtN(chapWords(c))} palabras · ≈${chapPages(c)} pág.</span></div>${actSel(c)}</div>`;
  const blocks=acts.map(a=>{
    const chs=b.chapters.filter(c=>c.actId===a.id);
    const w=chs.reduce((n,c)=>n+chapWords(c),0);
    return `<div class="card stt" style="margin-bottom:14px;--stc:${STCLR(a.estado)}">
      <div class="spread" style="margin-bottom:6px">
        <h3 style="cursor:pointer" onclick="openEnt('act','${a.id}')">${esc(a.name)}</h3>
        <span class="small muted num"><span class="cdot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${STCLR(a.estado)};margin-right:5px"></span>${STATUS[a.estado][0]} · ${chs.length} cap. · ${fmtN(w)} palabras · ≈${chs.reduce((n,c)=>n+chapPages(c),0)} págs.</span></div>
      ${a.desc?`<p class="small muted" style="margin:-2px 0 10px;font-style:italic">${esc(a.desc)}</p>`:''}
      ${chs.map(chapRow).join('')||'<p class="muted small">Sin capítulos en este acto.</p>'}
    </div>`;
  }).join('');
  const libres=b.chapters.filter(c=>!c.actId||!b.acts.some(a=>a.id===c.actId));
  view().innerHTML=`<div class="wrap-n">
    <div class="spread" style="margin-bottom:16px"><h2>Escaleta</h2>
      <div class="row">
      <button class="btn btn-s" onclick="openBookReader()">📖 Leer el libro</button>
      <button class="btn btn-p btn-s" onclick="addAct()">＋ Acto</button></div></div>
    ${blocks}
    <div class="card"><h3 class="muted" style="margin-bottom:6px">Sin asignar</h3>
      ${libres.map(chapRow).join('')||'<p class="muted small">Todos los capítulos están asignados.</p>'}</div>
  </div>`;
}
async function addAct(){
  const b=curBook(),n=await askText('Nuevo acto',`Acto ${['I','II','III','IV','V'][b.acts.length]||b.acts.length+1}`);
  if(!n)return;
  const maxO=b.acts.reduce((m,a)=>Math.max(m,a.order),0);
  const a={id:uid(),name:n,order:maxO+10,desc:'',estado:'borrador'};
  b.acts.push(a);scheduleSave();openEnt('act',a.id);
}
function setChapAct(chId,actId){
  const b=curBook(),c=b.chapters.find(c=>c.id===chId);
  c.actId=actId||null;c.updated=Date.now();scheduleSave();render();
}

/* ── Logros ── */
function renderLogros(r,s,b){
  const w=bookWords(b);
  const hitos=s.timelines.reduce((n,t)=>n+t.hitos.length,0);
  const terms=s.languages.reduce((n,l)=>n+l.words.length,0);
  const badges=[
    ['✒','Primer capítulo','Escribe tu primer capítulo',b.chapters.length>=1],
    ['✦','10.000 palabras','Alcanza las 10.000 palabras',w>=10000],
    ['✧','50.000 palabras','Alcanza las 50.000 palabras',w>=50000],
    ['❖','90.000 palabras','Alcanza las 90.000 palabras',w>=90000],
    ['♟','Elenco','Crea 10 personajes',s.characters.length>=10],
    ['✵','Cartógrafo','Traza 8 ubicaciones',s.places.length>=8],
    ['▦','Estructura','Organiza 3 actos',b.acts.length>=3],
    ['⧖','Cronista','Registra 5 hitos',hitos>=5],
    ['♜','Mundo vivo','Funda 3 grupos',s.groups.length>=3],
    ['✎','Lexicógrafo','Acuña 20 términos',terms>=20]];
  const won=badges.filter(x=>x[3]).length;
  const prog=b.goalWords>0?Math.min(100,Math.round(w/b.goalWords*100)):0;
  view().innerHTML=`<div class="wrap-n">
    <div class="card" style="margin-bottom:14px">
      <div class="spread"><h3>Objetivo del libro</h3>
        <button class="btn btn-s" onclick="setGoal()">${b.goalWords?'Cambiar objetivo':'Fijar objetivo'}</button></div>
      ${b.goalWords?`<div class="spread small num" style="margin:10px 0 8px"><span>${fmtN(w)} / ${fmtN(b.goalWords)} palabras</span><b>${prog}%</b></div>
        <div class="bar"><i style="width:${prog}%"></i></div>`
      :'<p class="muted small" style="margin-top:8px">Sin objetivo de palabras. Fija uno para ver tu progreso.</p>'}
    </div>
    <div class="statgrid" style="margin-bottom:22px">
      <div class="stat"><b class="num">${fmtN(sessDelta(b))}</b><span>Palabras esta sesión</span></div>
      <div class="stat"><b class="num">${fmtN(w)}</b><span>Palabras totales</span></div>
      <div class="stat"><b class="num">≈ ${fmtN(bookPages(b))}</b><span>Páginas A5</span></div>
      <div class="stat"><b class="num">${won}/${badges.length}</b><span>Insignias</span></div>
    </div>
    <h2 style="margin-bottom:12px">Insignias</h2>
    <div class="stack" style="gap:8px">${badges.map(([ic,t,d,ok])=>`<div class="badge ${ok?'won':''}">
      <span class="bic">${ic}</span><div><b>${t}</b><span>${d}</span></div></div>`).join('')}</div>
  </div>`;
}
async function setGoal(){
  const b=curBook();
  const n=await askNum('Objetivo de palabras',b.goalWords||90000,'0 = sin objetivo');
  if(n!==null){b.goalWords=Math.max(0,n);scheduleSave();render()}
}
</script>
<script>
'use strict';
/* ═══════════ Editor de capítulo ═══════════ */
const edClasses=ch=>`${ch.indent?'ind ':''}sp-${ch.spacing}`;
let edCountT=null;
function chNow(){const s=curSaga();if(!s)return null;const f=findChap(s,rTop().id);return f?f.ch:null}
function renderChap(r){
  const s=curSaga();if(!s){route=[{v:'lib'}];render();return}
  const f=findChap(s,r.id);if(!f){route.pop();render();return}
  const{book,ch}=f;
  state.meta.currentBook=book.id;ensureSession(book);
  snapshot(ch,false);
  view().innerHTML=`<div class="wrap-n">
    <div class="ed-head">
      <input class="ch-title" id="chTitle" value="${esc(ch.title)}" aria-label="Título del capítulo">
      <button class="iconb" title="Vista de páginas A5" onclick="openPages()">📄</button>
      <button class="iconb" title="Modo lectura" onclick="openReader()">Aa</button>
      <button class="iconb" title="Modo concentración" onclick="openFocus()">⛶</button>
      <button class="iconb" title="Panel del capítulo" onclick="openDrawer()">☰</button>
    </div>
    <div class="ed-tools">
      <button class="tb bld" data-c="bold" title="Negrita">B</button>
      <button class="tb itl" data-c="italic" title="Cursiva">I</button>
      <button class="tb und" data-c="underline" title="Subrayado">U</button>
      <button class="tb" data-j="Left" title="Alinear a la izquierda"><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect y="1" width="16" height="2"/><rect y="5" width="10" height="2"/><rect y="9" width="13" height="2"/></svg></button>
      <button class="tb" data-j="Center" title="Centrar"><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect y="1" width="16" height="2"/><rect x="3" y="5" width="10" height="2"/><rect x="1.5" y="9" width="13" height="2"/></svg></button>
      <button class="tb" data-j="Right" title="Alinear a la derecha"><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect y="1" width="16" height="2"/><rect x="6" y="5" width="10" height="2"/><rect x="3" y="9" width="13" height="2"/></svg></button>
      <button class="tb" id="tbH" title="Título de sección">T</button>
      <button class="tb" id="tbInd" title="Sangría del párrafo actual">⇥</button>
      <select id="tbSp" title="Espaciado">${['compacto','normal','amplio'].map(x=>`<option value="${x}" ${ch.spacing===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select>
      <button class="tb" id="tbFind" title="Buscar y reemplazar">⌕</button>
      <span class="ed-count" id="edCount"></span>
    </div>
    <div id="findBar" hidden>
      <input type="text" id="fbQ" placeholder="Buscar (^p = salto de párrafo)" oninput="fbType()">
      <button class="iconb" style="width:30px;height:30px" title="Anterior" onclick="fbGo(fbIdx-1)">‹</button>
      <span id="fbInfo"></span>
      <button class="iconb" style="width:30px;height:30px" title="Siguiente" onclick="fbGo(fbIdx+1)">›</button>
      <input type="text" id="fbR" placeholder="Reemplazar por">
      <label><input type="checkbox" id="fbCase" checked onchange="fbUpdate(true)">ignorar mayúsculas</label>
      <button class="btn btn-s" onclick="fbReplace()">Reemplazar todo</button>
      <button class="iconb" style="width:30px;height:30px" title="Cerrar" onclick="fbClose()">✕</button>
    </div>
    <div id="ed" contenteditable="true" spellcheck="true" lang="es" class="${edClasses(ch)}" aria-label="Texto del capítulo"></div>
  </div>`;
  const ed=$('#ed');ed.innerHTML=ch.body||'<p><br></p>';
  /* ancla las barras al borde real del visor (Chrome pega los sticky bajo el padding del scroller) */
  const _padTop=parseFloat(getComputedStyle(view()).paddingTop)||0;
  $('.ed-tools').style.top=(-_padTop)+'px';
  updCount(ch);
  $('#chTitle').oninput=e=>{ch.title=e.target.value;ch.updated=Date.now();book.updated=Date.now();scheduleSave()};
  ed.addEventListener('input',()=>{
    ch.body=cleanBody(ed);ch.updated=Date.now();book.updated=Date.now();scheduleSave();
    clearTimeout(edCountT);edCountT=setTimeout(()=>updCount(ch),350);
    if(!$('#findBar').hidden)fbType();
  });
  for(const b of $$('.ed-tools .tb[data-c]')){
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.onclick=()=>{ed.focus();document.execCommand(b.dataset.c);ch.body=cleanBody(ed);scheduleSave()};
  }
  for(const b of $$('.ed-tools .tb[data-j]')){
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.onclick=()=>{ed.focus();document.execCommand('justify'+b.dataset.j);ch.body=cleanBody(ed);scheduleSave()};
  }
  const tbH=$('#tbH');
  tbH.addEventListener('mousedown',e=>e.preventDefault());
  tbH.onclick=()=>{ed.focus();
    const cur=(document.queryCommandValue('formatBlock')||'').toLowerCase();
    document.execCommand('formatBlock',false,cur==='h3'?'p':'h3');
    ch.body=cleanBody(ed);scheduleSave();
  };
  const tbInd=$('#tbInd');
  tbInd.addEventListener('mousedown',e=>e.preventDefault());
  tbInd.onclick=()=>{
    ed.focus();
    const rg=selBlockRange();if(!rg)return;
    const blocks=edBlocks();
    const eff=b=>{const d=b.getAttribute('data-ind');return d==='1'?true:d==='0'?false:ed.classList.contains('ind')};
    const target=!eff(blocks[rg[0]]);
    for(let i=rg[0];i<=rg[1];i++){const b=blocks[i];if(b&&b.tagName!=='H3')b.setAttribute('data-ind',target?'1':'0')}
    ch.body=cleanBody(ed);scheduleSave();
    tbInd.classList.toggle('on',target);
  };
  $('#tbSp').onchange=e=>{ch.spacing=e.target.value;ed.className=edClasses(ch);scheduleSave()};
  $('#tbFind').onclick=()=>{
    const fb=$('#findBar');
    if(fb.hidden){
      const tools=$('.ed-tools');
      const pt=parseFloat(getComputedStyle(view()).paddingTop)||0;
      if(tools)fb.style.top=(tools.offsetHeight-pt)+'px'; /* pegada justo bajo la barra, aunque esta ocupe 2 filas */
      fb.hidden=false;$('#fbQ').focus();fbUpdate(false);
    }
    else fbClose();
  };
}
function updCount(ch){const el=$('#edCount');if(!el)return;const w=countWords(ch.body);el.textContent=`${fmtN(w)} palabras · ${readMins(w)} min`}
document.addEventListener('selectionchange',()=>{
  const ed=$('#ed');if(!ed)return;
  const ae=document.activeElement;
  if(ae!==ed&&!ed.contains(ae))return;
  for(const b of $$('.ed-tools .tb[data-c]')){
    try{b.classList.toggle('on',document.queryCommandState(b.dataset.c))}catch(e){}
  }
  for(const b of $$('.ed-tools .tb[data-j]')){
    try{b.classList.toggle('on',document.queryCommandState('justify'+b.dataset.j))}catch(e){}
  }
  const h=$('#tbH');
  if(h){try{h.classList.toggle('on',(document.queryCommandValue('formatBlock')||'').toLowerCase()==='h3')}catch(e){}}
  const ind=$('#tbInd');
  if(ind){const rg=selBlockRange();if(rg){const b=edBlocks()[rg[0]];if(b){const d=b.getAttribute('data-ind');ind.classList.toggle('on',d==='1'?true:d==='0'?false:ed.classList.contains('ind'))}}}
});
/* Buscar y reemplazar sobre nodos de texto */
function textNodes(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const a=[];let n;while(n=w.nextNode())a.push(n);return a}
function fbRegex(){
  const q=$('#fbQ').value;if(!q)return null;
  const e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp(e,'g'+($('#fbCase').checked?'i':''));
}
/* Modo párrafo: ^p representa el salto entre párrafos. Se opera sobre el HTML
   de cada bloque unido por un marcador, así se preserva negrita/cursiva. */
const PMARK=String.fromCharCode(1);
function fbHasPara(){return $('#fbQ').value.includes('^p')}
function fbParaRegex(){
  const q=$('#fbQ').value;if(!q)return null;
  let e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  e=e.split('\\^p').join(PMARK);
  return new RegExp(e,'g'+($('#fbCase').checked?'i':''));
}
let fbMarks=[],fbIdx=-1,fbT=null;
function fbType(){clearTimeout(fbT);fbT=setTimeout(()=>fbUpdate(true),250)}
function fbUnmark(){
  const ed=$('#ed');if(!ed)return;
  for(const mk of ed.querySelectorAll('mark.fmk')){
    const p=mk.parentNode;
    p.replaceChild(document.createTextNode(mk.textContent),mk);
    p.normalize();
  }
}
function fbClear(){fbUnmark();fbMarks=[];fbIdx=-1}
function fbClose(){const fb=$('#findBar');if(fb)fb.hidden=true;fbClear()}
function cleanBody(ed){
  if(!ed.querySelector('mark.fmk')&&!ed.querySelector('mark.rvk')&&!ed.querySelector('.sc-dim'))return ed.innerHTML;
  const cl=ed.cloneNode(true);
  for(const mk of cl.querySelectorAll('mark.fmk,mark.rvk'))mk.replaceWith(document.createTextNode(mk.textContent));
  for(const el of cl.querySelectorAll('.sc-dim')){el.classList.remove('sc-dim');if(!el.getAttribute('class'))el.removeAttribute('class')}
  cl.normalize();
  return cl.innerHTML;
}
function fbUpdate(jump){
  fbClear();
  const info=$('#fbInfo');if(info)info.textContent='';
  const ed=$('#ed');if(!ed)return;
  if(fbHasPara()){
    const re=fbParaRegex();if(!re)return;
    const joined=edBlocks().map(b=>b.innerHTML).join(PMARK);
    const n=(joined.match(re)||[]).length;
    if(info)info.textContent=n?('¶ '+n):'0';
    return;
  }
  const re=fbRegex();if(!re)return;
  for(const t of textNodes(ed)){
    const str=t.nodeValue;const parts=[];let m;re.lastIndex=0;
    while((m=re.exec(str))){
      if(!m[0]){re.lastIndex++;continue}
      parts.push([m.index,m[0].length]);
    }
    if(!parts.length)continue;
    const frag=document.createDocumentFragment();let pos=0;
    for(const[i,len]of parts){
      if(i>pos)frag.appendChild(document.createTextNode(str.slice(pos,i)));
      const mk=document.createElement('mark');mk.className='fmk';mk.textContent=str.slice(i,i+len);
      frag.appendChild(mk);fbMarks.push(mk);pos=i+len;
    }
    if(pos<str.length)frag.appendChild(document.createTextNode(str.slice(pos)));
    t.parentNode.replaceChild(frag,t);
  }
  if(info)info.textContent=String(fbMarks.length);
  if(jump&&fbMarks.length)fbGo(0);
}
function fbGo(i){
  if(!fbMarks.length)return;
  if(fbIdx>=0&&fbMarks[fbIdx])fbMarks[fbIdx].classList.remove('cur');
  fbIdx=((i%fbMarks.length)+fbMarks.length)%fbMarks.length;
  const mk=fbMarks[fbIdx];
  mk.classList.add('cur');
  mk.scrollIntoView({block:'center'});
  const info=$('#fbInfo');if(info)info.textContent=`${fbIdx+1}/${fbMarks.length}`;
}
function fbReplace(){
  const ed=$('#ed');
  if(fbHasPara()){
    const re=fbParaRegex();if(!re){toast('Escribe algo que buscar');return}
    fbClear();
    let joined=edBlocks().map(b=>b.innerHTML).join(PMARK);
    const n=(joined.match(re)||[]).length;
    const rep=$('#fbR').value.split('^p').join(PMARK);
    joined=joined.replace(re,rep);
    ed.innerHTML=joined.split(PMARK).map(h=>`<p>${h.trim()===''?'<br>':h}</p>`).join('');
    const ch=chNow();
    if(ch){ch.body=cleanBody(ed);ch.updated=Date.now();scheduleSave();updCount(ch)}
    toast((n===1?'1 reemplazo':`${n} reemplazos`)+' · párrafos reorganizados');
    fbUpdate(false);
    return;
  }
  const re=fbRegex();if(!re){toast('Escribe algo que buscar');return}
  const rep=$('#fbR').value;let n=0;
  fbClear();
  for(const t of textNodes(ed)){
    const m=t.nodeValue.match(re);
    if(m){n+=m.length;t.nodeValue=t.nodeValue.replace(re,rep)}
  }
  const ch=chNow();
  if(ch){ch.body=cleanBody(ed);ch.updated=Date.now();scheduleSave();updCount(ch)}
  toast(n===1?'1 reemplazo':`${n} reemplazos`);
  fbUpdate(false);
}
